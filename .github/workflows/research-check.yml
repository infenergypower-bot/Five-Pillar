name: Research feature checks
on:
  pull_request:
    paths:
      - "src/lib/research/**"
      - "src/components/business-research-workspace*"
      - "src/app/business-research/**"
      - "src/app/api/business-research/**"
      - "src/app/api/jobs/research/**"
      - "prisma/**"
      - ".github/workflows/research-check.yml"
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/five_pillar?schema=public
      AUTH_SECRET: ci-only-secret-with-at-least-thirty-two-characters
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npx prisma validate
      - run: npm run check

t firewall log","Disable all Azure workloads immediately","Assume user risk equals confirmed exfiltration"],"answers":[0],"why":"Correlated evidence from multiple control layers supports an accurate investigation and containment.","type":"single"},{"id":"q103","track":"SC-100","domain":"Security operations","stem":"A SOC needs detection rules and reversible response automation. Which architecture is appropriate?","choices":["Defender XDR signals integrated with SIEM/SOAR, validation and runbooks","One unmonitored script that deletes all identities on any alert","Permanent global admin service account","No alert tuning"],"answers":[0],"why":"Design response automation with confidence thresholds, oversight and controlled actions.","type":"single"},{"id":"q104","track":"SC-100","domain":"Security operations","stem":"What should an identity architect include in a B2B strategy?","choices":["Partner trust, assignment, lifecycle, reviews and conditional access","Only an invitation link","No expiry or owner","An organization-wide guest Global Administrator role"],"answers":[0],"why":"External identity architecture requires trust, scoped entitlements, lifecycle and evidence.","type":"single"},{"id":"q105","track":"SC-100","domain":"Security operations","stem":"Which architecture most limits privileged credential exposure?","choices":["Eligible roles, secure admin devices, least privilege and monitored activation","Permanent Global Admin on ordinary email devices","Shared break-glass account for daily use","Unlimited app consent"],"answers":[0],"why":"Privilege security is multi-layered and extends beyond MFA alone.","type":"single"},{"id":"q106","track":"SC-100","domain":"Security operations","stem":"An organization must demonstrate control effectiveness to auditors. Which evidence strategy is strongest?","choices":["Map requirement to owner, technical control, operational evidence and exceptions","Show only a colorful product dashboard","Avoid retaining change records","Treat a score as legal proof"],"answers":[0],"why":"Traceable control design and evidence link compliance requirements to operation.","type":"single"},{"id":"q107","track":"SC-100","domain":"Security operations","stem":"A company uses customer biometric proofing and phishing-resistant sign-in. Why distinguish identity proofing from authentication?","choices":["Enrollment identity assurance and subsequent authenticator assurance are different risks","They are identical by definition","Strong sign-in proves historical proofing occurred","Proofing is only about licensing"],"answers":[0],"why":"IAL and AAL assess different parts of the identity lifecycle and assurance model.","type":"single"},{"id":"q108","track":"SC-100","domain":"Infrastructure security","stem":"You must inventory security posture across Azure and eligible on-premises servers. Which architecture may help?","choices":["Defender for Cloud with Azure Arc-supported resource integration","OAuth consent only","A single SAML certificate","Company branding"],"answers":[0],"why":"Azure Arc can extend selected management capabilities to hybrid resources, helping posture visibility.","type":"single"},{"id":"q109","track":"SC-100","domain":"Infrastructure security","stem":"An ICS device cannot accept standard endpoint security agents. What is the most reasonable design?","choices":["Segment and monitor with compensating controls, respecting safety constraints","Force an untested patch during production","Expose device administration publicly","Disable inventory"],"answers":[0],"why":"OT environments often need non-disruptive monitoring and compensating controls.","type":"single"},{"id":"q110","track":"SC-100","domain":"Infrastructure security","stem":"An Azure database should not accept arbitrary public traffic from application clients. Which design fits?","choices":["Restrict network paths using private connectivity and appropriate service identity/authorization","Grant anonymous write access","Store administrator function lessonView(id){let x=LESSONS.find(y=>y.id===id);if(!x)return notfound();let l=LABS.find(y=>y.id===x.lab),step=db.lessonReveal[id]||0,q=getLessonQuestion(x),check=db.lessonChecks?.[id],flow=x.steps.slice(0,5);let relevant=LESSONS.filter(y=>y.track===x.track),idx=relevant.findIndex(y=>y.id===id),next=relevant[idx+1];return `<div class="page"><div class="flex between wrap"><button class="btn xs" data-route="learn">← Learning tracks</button><span class="pill">${x.track} · ${safe(x.domain)}</span></div><div class="lessonlayout" style="margin-top:19px"><div class="lessonmain"><div class="eyebrow">Unit ${idx+1} / ${relevant.length} · Guided study</div><h1 style="margin:8px 0 12px">${safe(x.title)}</h1><p class="muted">This lesson teaches the reasoning first. Then use the same concept in the practice tenant.</p><div class="teaching"><div class="eyebrow">Think of it like this</div><div class="analogy">${safe(x.analogy)}</div><h3 style="margin:23px 0 10px">What it means</h3><p>${safe(x.concept)}</p><h3>What actually happens technically</h3><p>${safe(x.mechanics)}</p></div><div class="teaching"><div class="eyebrow">Visual model</div><h3>Follow the operational sequence</h3><div class="flow">${flow.map((s,i)=>`<div class="flownode"><div class="eyebrow" style="font-size:10px">STEP ${i+1}</div>${safe(s.split(' ').slice(0,5).join(' '))}${s.split(' ').length>5?'…':''}</div>`).join('')}</div><p class="hint">Choose each operation in order. In a real tenant, each stage has permissions, licensing, change-control and audit considerations.</p><div class="scenario"><div class="eyebrow">Worked example</div><p style="margin:10px 0 0">${safe(x.example)}</p></div></div><div class="teaching"><div class="eyebrow">Click-through teaching</div><h3>Let the coach guide your thinking</h3><div class="progress" style="margin-bottom:19px"><span style="width:${(step+1)/x.steps.length*100}%"></span></div><div class="step"><div class="stepno">${step+1}</div><div class="details"><b>${safe(x.steps[step])}</b><p class="muted small">${safe(stepWhy(x,step))}</p></div></div><div class="flex wrap"><button class="btn" data-action="reveal-prev" data-id="${id}" ${step===0?'disabled':''}>← Previous</button><button class="btn primary" data-action="reveal-next" data-id="${id}" ${step===x.steps.length-1?'disabled':''}>Next step →</button><span class="pill">${step+1}/${x.steps.length}</span></div><h3 style="margin-top:24px">Complete walkthrough checklist</h3>${x.steps.map((s,i)=>`<div class="step"><div class="stepno" style="background:#e9edfd;color:#5950c7">${i+1}</div><div class="details">${safe(s)}<p class="hint">${safe(stepWhy(x,i))}</p></div></div>`).join('')}</div><div class="caution"><b>Common mistake</b><p style="margin:7px 0 0">${safe(x.trap)}</p></div><div class="teaching"><div class="eyebrow">Apply it</div><h3>${l?safe(l.title):'Try a guided mission'}</h3><p>${l?safe(l.story):'Choose a mission related to this domain.'}</p><button class="btn teal" data-lab="${x.lab||LABS[0].id}">▶ Open guided practice tenant</button><p class="hint" style="margin-top:12px">Make changes in the fictional console. Your coach checks actions and explains why they matter.</p></div><div class="teaching"><div class="eyebrow">Knowledge check</div><h3>Can you apply what you learned?</h3>${q?questionComponent(q,'lesson',id):'<p>Open the full practice question bank for this topic.</p>'}<div class="flex wrap" style="margin-top:22px"><button class="btn primary" data-action="complete-lesson" data-id="${x.id}">${db.completed.includes(x.id)?'✓ Lesson completed':'Mark lesson complete'}</button>${next?`<button class="btn" data-route="lesson/${next.id}">Next lesson →</button>`:''}</div></div></div><aside class="asidepanel"><div class="panel"><span class="eyebrow">Your learning tools</span><h3 style="margin-top:8px">Learn → Do → Prove</h3><div class="infopair"><b>Level</b><span>${x.track}</span><b>Guided time</b><span>${x.minutes} min + tenant practice</span><b>Lab</b><span>${safe(l?.title||'Guided simulation')}</span></div><button class="btn primary" data-lab="${x.lab||'lab-users'}" style="width:100%;margin:10px 0">Open practice lab</button><a class="btn" target="_blank" rel="noopener" href="${x.track==='ROLE'?'https://learn.microsoft.com/en-us/entra/':LINKS[x.track]}" style="width:100%;text-decoration:none">Official Microsoft objectives ↗</a></div><div class="panel" style="margin-top:14px"><b>Personal study note</b><textarea class="notearea" style="margin-top:10px" id="lesson-note" data-note="${x.id}" placeholder="Explain the idea in your own words; record what confused you.">${safe(db.notes?.[x.id]||'')}</textarea><button class="btn xs" data-action="save-note" data-id="${x.id}">Save note</button></div></aside></div>${footer()}</div>`}
function stepWhy(x,i){const parts=[`Why first? Establish the ${x.domain.toLowerCase()} context and confirm the scope before modifying any live service.`,`Why this matters: ${x.concept.split('. ')[0]}.`,`Why now? Every permission or policy choice has a dependency; record the intended impact and owner.`,`How to verify: check the changed object or evaluation result, not just the success message.`,`How to recover: document change approval, affected users, audit evidence and a safe rollback path.`];return parts[Math.min(i,4)]}
function questionComponent(q,context,id){const chosen=db.answers?.[q.id]||[],graded=!!db.lessonChecks?.[id],correct=JSON.stringify([...chosen].sort())===JSON.stringify([...q.answers].sort());return `<div class="instruct"><div class="questionopts"><p class="examquestion" style="font-size:16px">${safe(q.stem)}</p>${q.type==='multi'?'<span class="pill">Select all correct answers</span>':''}${q.choices.map((c,i)=>`<label class="choice ${graded&&q.answers.includes(i)?'correct':''} ${graded&&chosen.includes(i)&&!q.answers.includes(i)?'wrong':''}"><input type="${q.type==='multi'?'checkbox':'radio'}" name="answer-${q.id}" value="${i}" ${chosen.includes(i)?'checked':''} ${graded?'disabled':''}> ${safe(c)}</label>`).join('')}</div>${graded?`<div class="explanation"><b>${correct?'✓ Correct':'Review this explanation'}</b><p>${safe(q.why)}</p></div>`:`<button class="btn primary" data-action="check-lesson-question" data-id="${id}" data-question="${q.id}">Check understanding</button>`}</div>`}

function matrixView(){let filters=['All','SC-900','SC-300','SC-100','ROLE'],selected=db.matrixFilter||'All',o=OBJECTIVES.filter(x=>selected==='All'||x.track===selected);return `<div class="page"><div class="eyebrow">Traceability to official topics</div><h1>Know what the exams measure.</h1><p class="muted">These are paraphrased objective clusters, based on Microsoft’s October 2026 exam study guides. The checkmarks mean you completed a mapped lesson—not that every underlying Microsoft objective was demonstrated in a live tenant.</p><div class="pillrow">${filters.map(x=>`<button class="btn ${selected===x?'primary':''}" data-action="matrix-filter" data-id="${x}">${x}</button>`).join('')}</div><div class="panel" style="padding:0"><div class="matrixrow head"><span>Exam</span><span>Objective group</span><span class="matrixscope">Coverage & lesson</span><span>Learning</span></div>${o.map(x=>`<div class="matrixrow"><span><span class="pill">${x.track}</span></span><div><b>${safe(x.topic)}</b><div class="muted mobile-only">${safe(x.scope)}</div></div><div class="matrixscope">${safe(x.scope)}<br><a href="${x.official}" target="_blank" rel="noopener">Official scope ↗</a></div><div><button class="btn xs" data-route="lesson/${x.lesson}">${db.completed.includes(x.lesson)?'✓ Review':'Study →'}</button></div></div>`).join('')}</div><div class="caution" style="margin-top:17px">Full Microsoft skill statements, prerequisite requirements and updated assessment links are on the official study-guide pages. Track changes before scheduling an exam.</div>${footer()}</div>`}
function portfolioView(){const audits=db.audit.slice(0,12);return `<div class="page"><div class="eyebrow">Architecture experience</div><h1>Turn your practice into a portfolio.</h1><p class="muted">Export a fictional design decision record, then perform real supervised lab implementations when you have access to a licensed sandbox.</p><div class="grid2"><div class="panel"><h3>Project 1: Workforce onboarding and access</h3><p class="muted small">Evidence: user/group lifecycle, appropriate licenses, app assignment, guest controls, SCIM plan, tested deprovisioning.</p><button class="btn xs" data-lab="lab-users">Practice onboarding →</button></div><div class="panel"><h3>Project 2: Phishing-resistant access</h3><p class="muted small">Evidence: pilot users, passkey enrollment, CA report-only, What If, sign-in log matrix, rollback and emergency access.</p><button class="btn xs" data-lab="lab-policy">Practice access policy →</button></div><div class="panel"><h3>Project 3: Governance and privilege</h3><p class="muted small">Evidence: package request/approval, revocation, review, eligible role activation and privileged event history.</p><button class="btn xs" data-lab="lab-pim">Practice privilege →</button></div><div class="panel"><h3>Project 4: Enterprise identity modernization</h3><p class="muted small">Evidence: architectural diagram, trust boundaries, risks, rollout phases, measurable objectives and executive presentation.</p><button class="btn xs" data-route="portal/blueprint">Design solution →</button></div></div><div class="sectionheader"><h2>Your latest simulated audit evidence</h2></div><div class="panel">${audits.length?audits.map(a=>`<div style="border-bottom:1px solid #e9edf3;padding:9px 0"><div class="muted tiny">${safe(a.time)}</div><div class="small">${safe(a.text)}</div></div>`).join(''):'<p class="muted">Complete a guided mission to populate your practice audit record.</p>'}<button class="btn xs" style="margin-top:14px" data-action="export-audit">↓ Export prac function handleForm(form){const kind=form.dataset.kind,vals=Object.fromEntries(new FormData(form).entries());if(!kind)return;const v=vals;let ok=true,msg='Saved in the practice tenant';const nextId=()=>`obj-${Math.random().toString(36).slice(2,9)}`;
 switch(kind){
 case 'user':if(db.users.some(x=>x.email.toLowerCase()===v.email.toLowerCase())){ok=false;msg='That email already exists'}else db.users.push({id:nextId(),name:v.name,email:v.email,type:'Member',role:'',licenses:[],tap:false,revoked:false});break;

 case 'tap':{let u=db.users.find(x=>x.id===v.user);if(u)u.tap=true;break}

 case 'permission':{let x=db.regs.find(x=>x.id===v.registration);if(x&&!x.permissions.includes(v.permission))x.permissions.push(v.permission);break}

 }
 if(ok){record(`${kind}: ${JSON.stringify(v).slice(0,160)}`);save();document.getElementById('modal').innerHTML='';toast(msg,'good');render()}else toast(msg,'bad')

function userDetail(id){const x=db.users.find(v=>v.id===id);if(!x)return portHeader('User not found','Return to All users','<button class="btn" data-route="portal/users">Back</button>');let memberships=db.groups.filter(g=>g.members.includes(x.id));return portHeader('♙ '+safe(x.name),'User properties and access controls.',`<button class="btn" data-route="portal/users">← All users</button>${rowButtons([['user-license','Assign license',id],['user-revoke','Revoke sessions',id],['user-tap','Issue TAP',id]])}`)+subTabs(['Overview','Groups','Roles','Licenses','Authentication methods'],'Overview')+`<div class="grid2 ms-detail"><div><h3>Identity</h3><div class="ms-propertygrid"><b>Display name</b><span>${safe(x.name)}</span><b>User principal name</b><span>${safe(x.email)}</span><b>Object ID</b><span>${safe(x.id)}</span><b>User type</b><span>${safe(x.type)}</span><b>Account status</b><span>${x.disabled?'Blocked':'Enabled'}</span><b>Last session action</b><span>${x.revoked?'Sessions revoked':'Not revoked'}</span></div><h3>Directory profile</h3><form id="user-detail-form" class="ms-detail-edit"><input type="hidden" name="id" value="${safe(x.id)}"><label class="field">Display name<input name="name" required value="${safe(x.name)}"></label><label class="field">User type<select name="type"><option ${x.type==='Member'?'selected':''}>Member</option><option ${x.type==='Guest'?'selected':''}>Guest</option></select></label><button class="btn primary" type="submit">Save changes</button></form></div><div><h3>Access</h3><p class="small"><b>Groups</b></p>${memberships.map(g=>`<button class="ms-link-row" data-route="portal/group/${g.id}">${safe(g.name)} →</button>`).join('')||'<p class="muted small">No security group membership</p>'}<p class="small"><b>Assigned licenses</b></p><p class="muted small">${safe((x.licenses||[]).join(', ')||'None assigned')}</p><p class="small"><b>Role</b></p><p class="muted small">${safe(x.role||'None')}</p><div class="ms-hint-panel"><b>Why it matters</b><p>Group membership drives authorization and policy targeting. A license unlocks features; it does not automatically authorize access to an application.</p></div></div></div>`}
function groupDetail(id){const x=db.groups.find(v=>v.id===id);if(!x)return portHeader('Group not found','Return to All groups');return portHeader('♟ '+safe(x.name),'Security group settings, membership, and access.',`<button class="btn" data-route="portal/groups">← All groups</button>${rowButtons([['group-add-member','＋ Add member']])}`)+subTabs(['Overview','Members','Roles and administrators','Applications'],'Overview')+`<div class="ms-propertygrid"><b>Name</b><span>${safe(x.name)}</span><b>Group type</b><span>Security</span><b>Object ID</b><span>${safe(x.id)}</span><b>Membership type</b><span>Assigned (training)</span></div><h3>Members (${x.members.length})</h3>${table(['Name','User principal name','Remove'],x.members.map(uid=>{let u=db.users.find(t=>t.id===uid);return `<tr><td><a href="#/portal/user/${uid}" class="ms-record-link">${safe(u?.name||uid)}</a></td><td>${safe(u?.email||'')}</td><td><button class="btn xs" data-action="remove-group-member" data-id="${safe(id+'|'+uid)}">Remove</button></td></tr>`}))}<div class="ms-hint-panel"><b>Why it matters</b><p>Group-based access scales better than assigning hundreds of individuals. Always review membership and how it changes application and CA policy scope.</p></div>`}
function policyDetail(id){const x=db.policies.find(v=>v.id===id);if(!x)return portHeader('Policy not found','Return to Conditional Access');return portHeader('⛨ '+safe(x.name),'Inspect and modify a training Conditional Access policy.',`<button class="btn" data-route="portal/policies">← Policies</button><button class="btn" data-route="portal/whatif">▶ What If</button>`)+subTabs(['Overview','Users','Target resources','Grant controls','Session'],'Overview')+`<div class="ms-propertygrid"><b>Policy state</b><span>${pbadge(x.state)}</span><b>Included users / group</b><span>${safe(x.group)}</span><b>Target resources</b><span>${safe(x.app)}</span><b>Access control</b><span>${safe(x.control)}</span></div><h3>Edit policy</h3><form id="policy-detail-form" class="ms-detail-edit"><input type="hidden" name="id" value="${safe(x.id)}"><label class="field">Policy name<input name="name" required value="${safe(x.name)}"></label><label class="field">Included groups<select name="group">${['All users',...db.groups.map(g=>g.name)].map(z=>`<option ${z===x.group?'selected':''}>${safe(z)}</option>`).join('')}</select></label><label class="field">Target resources<select name="app">${['Finance Reports','Vendor Portal','All cloud apps'].map(z=>`<option ${z===x.app?'selected':''}>${safe(z)}</option>`).join('')}</select></label><label class="field">Access control<select name="control">${['Require MFA','Block access','Require compliant device','Block legacy clients (concept)'].map(z=>`<option ${z===x.control?'selected':''}>${safe(z)}</option>`).join('')}</select></label><label class="field">Policy state<select name="state">${['Off','Report-only','On'].map(z=>`<option ${z===x.state?'selected':''}>${safe(z)}</option>`).join('')}</select></label><div class="ms-hint-panel"><b>Always pilot with report-only</b><p>Changing a real policy can block administrators and employees. In this simulator, you can experiment; production changes require change control and protected emergency access.</p></div><button class="btn primary" type="submit">Save simulated policy</button></form>`}
function submitDetail(form){let v=Object.fromEntries(new FormData(form).entries());if(form.getAttribute('id')==='user-detail-form'){let u=db.users.find(x=>x.id===v.id);if(u){u.name=v.name.trim();u.type=v.type;record('Updated user '+u.name);save();toast('User changes saved','good');render();}return true;}if(form.getAttribute('id')==='policy-detail-form'){let p=db.policies.find(x=>x.id===v.id);if(p){Object.assign(p,{name:v.name.trim(),group:v.group,app:v.app,control:v.control,state:v.state});record('Modified policy '+p.name);save();toast('Policy updated in training tenant','good');render();}return true;}return false}
const _oldPortalAction=portalAction;
portalAction=function(act,el){if(act==='remove-group-member'){const [gid,uid]=(el.dataset.id||'').split('|');const g=db.groups.find(x=>x.id===gid);if(g){g.members=g.members.filter(x=>x!==uid);record('Removed group member '+uid);save();toast('Group membership updated','good');render();}return;}return _oldPortalAction(act,el)};
document.addEventListener('submit',e=>{if(e.target.matches('#user-detail-form,#policy-detail-form')){e.preventDefault();submitDetail(e.target)}});

let examState=null,examClock=null;
function seededShuffle(a){let arr=[...a];for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function examsView(){let history=db.examHistory||[];return `<div class="page"><div class="eyebrow">Scenario-based practice</div><h1>Test decisions, not memorized phrases.</h1><p class="muted maincopy">${QUESTIONS.length} original practice questions mapped to learning domains. This is independent practice—not leaked exam material, Microsoft’s exam engine or an official passing-score prediction.</p><div class="grid3" style="margin:18px 0">${[['SC-900',QUESTIONS.filter(q=>q.track==='SC-900').length],['SC-300',QUESTIONS.filter(q=>q.track==='SC-300').length],['SC-100',QUESTIONS.filter(q=>q.track==='SC-100').length]].map(x=>`<div class="panel"><div class="statnum">${x[1]}</div><div class="statlabel">${x[0]} practice questions</div></div>`).join('')}</div><div class="grid2"><div class="panel"><h3>Set up a mock assessment</h3><form id="exam-setup"><label class="field">Certification track<select name="track"><option value="SC-300">SC-300 · Identity administrator</option><option value="SC-900">SC-900 · Fundamentals</option><option value="SC-100">SC-100 · Architect</option><option value="ROLE">Role specialization</option></select></label><label class="field">Number of questions<select name="count"><option value="10">10 · Quick quiz</option><option value="20">20 · Topic review</option><option value="40">40 · Long mock</option><option value="200">All available questions</option></select></label><label class="field">Mode<select name="mode"><option value="practice">Practice · Explanation after submission</option><option value="exam">Mock exam · Explanations at the end</option></select></label><label class="field">Duration<select name="minutes"><option value="0">Untimed</option><option value="30">30 minutes</option><option value="60">60 minutes</option><option value="100">100 minutes</option></select></label><button class="btn primary" type="submit">Begin assessment →</button></form></div><div class="panel"><h3>What a readiness result means</h3><div class="flow"><div class="flownode">Understand</div><div class="flownode">Lab evidence</div><div class="flownode">New scenarios</div></div><p class="small muted">Aim for consistently strong scores on fresh questions, explain why all distractors fail, validate core tasks in a real licensed test tenant and take Microsoft’s current official practice assessment.</p><div class="caution"><b>Do not memorize exam dumps.</b><p class="small" style="margin:6px 0">They may be inaccurate, outdated or unauthorized and can violate Microsoft certification rules.</p></div><a target="_blank" rel="noopener" href="${LINKS['SC-300']}">Official SC-300 study guide ↗</a></div></div><div class="sectionheader"><h2>Previous assessments</h2></div><div class="panel">${history.length?`<div class="scrolltable"><table class="ptable"><thead><tr><th>Date</th><th>Track</th><th>Result</th><th>Correct</th></tr></thead><tbody>${[...history].reverse().slice(0,20).map(x=>`<tr><td>${safe(x.date)}</td><td>${x.track}</td><td><b>${x.percent}%</b></td><td>${x.score}/${x.total}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">No assessment history yet. Start your first mock assessment above.</p>'}</div>${footer()}</div>`}
function examSetupSubmit(form){const v=Object.fromEntries(new FormData(form).entries()),pool=QUESTIONS.filter(q=>q.track===v.track),list=seededShuffle(pool).slice(0,Math.min(Number(v.count),pool.length));examState={track:v.track,mode:v.mode,minutes:Number(v.minutes),started:Date.now(),ids:list.map(x=>x.id),at:0,answers:{},flags:[],submitted:false,reviewIndex:0};go('exam/live')}
function getExamQ(){return QUESTIONS.find(x=>x.id===examState?.ids?.[examState.at])}
function examView(){if(!examState)return `<div class="page"><h1>No exam in progress</h1><button class="btn primary" data-route="exams">Choose an assessment</button></div>`;if(examState.submitted)return examResults();let s=examState,q=getExamQ(),total=s.ids.length,index=s.at,values=s.answers[q.id]||[],graded=s.mode==='practice'&&s.checked?.[q.id],correct=graded&&JSON.stringify([...values].sort())===JSON.stringify([...q.answers].sort());return `<div class="page examcard"><div class="flex between wrap"><button class="btn xs" data-route="exams">← Assessments</button><div class="flex"><span class="pill">${s.track} · ${s.mode==='exam'?'Mock exam':'Practice mode'}</span><span class="pill dark timer" id="examTime">${s.minutes?`${s.minutes}:00`:'Untimed'}</span></div></div><div class="panel" style="margin-top:18px"><div class="flex between"><b>Question ${index+1} of ${total}</b><span class="muted small">${safe(q.domain)}</span></div><div class="progress" style="margin:13px 0 22px"><span style="width:${(index+1)/total*100}%"></span></div><p class="examquestion">${safe(q.stem)}</p>${q.type==='multi'?'<p class="pill warning">Choose ALL that apply</p>':''}<div class="questionopts">${q.choices.map((c,i)=>`<label class="choice ${values.includes(i)?'selected':''} ${graded&&q.answers.includes(i)?'correct':''} ${graded&&values.includes(i)&&!q.answers.includes(i)?'wrong':''}"><input type="${q.type==='multi'?'checkbox':'radio'}" name="exam-answer" data-choice="${i}" value="${i}" ${values.includes(i)?'checked':''} ${graded?'disabled':''}> <b>${String.fromCharCode(65+i)}.</b> ${safe(c)}</label>`).join('')}</div>${graded?`<div class="explanation"><b>${correct?'✓ Correct':'Not quite'}</b><p>${safe(q.why)}</p></div>`:''}<div class="stickybar" style="margin-top:20px"><button class="btn" data-action="exam-prev" ${index===0?'disabled':''}>← Previous</button>${s.mode==='practice'&&!graded?`<button class="btn" data-action="exam-check">Explain answer</button>`:''}<button class="btn" data-action="exam-flag">${s.flags.includes(q.id)?'⚑ Flagged':'⚐ Flag review'}</button><span class="right"></span>${index<total-1?`<button class="btn primary" data-action="exam-next">Next question →</button>`:`<button class="btn primary" data-action="exam-submit">Submit exam →</button>`}</div><div class="muted small" style="margin-top:14px">Answered ${Object.keys(s.answers).filter(k=>s.answers[k]?.length).length}/${total} · Flagged ${s.flags.length}</div></div><div class="panel" style="margin-top:15px"><div class="eyebrow">Question navigator</div><div class="pillrow">${s.ids.map((id,i)=>`<button class="btn xs ${i===index?'primary':''}" data-action="exam-jump" data-index="${i}" title="${s.answers[id]?.length?'Answered':'Not answered'}">${s.flags.includes(id)?'⚑':''}${i+1}${s.answers[id]?.length?'✓':''}</button>`).join('')}</div></div>${footer()}</div>`}
function examResults(){let s=examState,questions=s.ids.map(id=>QUESTIONS.find(x=>x.id===id)),score=questions.reduce((n,q)=>n+(JSON.stringify([...(s.answers[q.id]||[])].sort())===JSON.stringify([...q.answers].sort())?1:0),0),pct=Math.round(score/s.ids.length*100),domains=[...new Set(questions.map(q=>q.domain))].map(d=>{let chunk=questions.filter(q=>q.domain===d),n=chunk.filter(q=>JSON.stringify([...(s.answers[q.id]||[])].sort())===JSON.stringify([...q.answers].sort())).length;return {domain:d,score:n,total:chunk.length}});return `<div class="page examcard"><div class="eyebrow">Assessment report</div><h1>${s.track} · ${pct}% correct</h1><div class="grid3"><div class="panel"><div class="statnum">${score}/${s.ids.length}</div><div class="statlabel">Correct answers</div></div><div class="panel"><div class="statnum">${pct}%</div><div class="statlabel">This original mock assessment</div></div><div class="panel"><div class="statnum">${s.flags.length}</div><div class="statlabel">Flagged questions</div></div></div><div class="caution" style="margin:16px 0"><b>Score interpretation</b><p style="margin:6px 0">This is a raw percent, not Microsoft’s scaled score. A score here cannot establish that you will pass the official exam.</p></div><div class="panel"><h3>By objective area</h3>${domains.map(d=>`<div style="padding:10px 0"><div class="flex between"><span class="small">${safe(d.domain)}</span><b class="small">${d.score}/${d.total}</b></div><div class="progress" style="margin-top:7px"><span style="width:${d.score/d.total*100}%"></span></div></div>`).join('')}</div><h2 style="margin-top:25px">Review every decision</h2>${questions.map((q,i)=>{const vals=s.answers[q.id]||[],correct=JSON.stringify([...vals].sort())===JSON.stringify([...q.answers].sort());return `<details class="detailsummary"><summary>${correct?'✓':'✕'} Question ${i+1}: ${safe(q.stem.slice(0,105))}${q.stem.length>105?'…':''}</summary><div><p class="small">${safe(q.stem)}</p>${q.choices.map((v,j)=>`<div class="choice ${q.answers.includes(j)?'correct':vals.includes(j)?'wrong':''}"><b>${String.fromCharCode(65+j)}.</b> ${safe(v)} ${q.answers.includes(j)?'<b>✓ Correct answer</b>':''} ${vals.includes(j)?'<span class="pill">Your selection</span>':''}</div>`).join('')}<div class="explanation"><b>Why:</b> ${safe(q.why)}</div></div></details>`}).join('')}<div class="flex wrap" style="margin-top:20px"><button class="btn primary" data-route="exams">Create new practice exam</button><button class="btn" data-route="objectives">Study objective matrix</button></div>${footer()}</div>`}
function examAction(a,el){if(!examState)return;if(a==='exam-prev')examState.at=Math.max(0,examState.at-1);else if(a==='exam-next')examState.at=Math.min(examState.ids.length-1,examState.at+1);else if(a==='exam-jump')examState.at=Number(el.dataset.index);else if(a==='exam-flag'){let id=getExamQ().id;examState.flags=examState.flags.includes(id)?examState.flags.filter(x=>x!==id):[...examState.flags,id]}else if(a==='exam-check'){const q=getExamQ();if(!examState.answers[q.id]?.length){toast('Choose an answer first.','bad');return}examState.checked=examState.checked||{};examState.checked[q.id]=true}else if(a==='exam-submit'){let unanswered=examState.ids.filter(id=>!examState.answers[id]?.length);if(unanswered.length&&!confirm(`${unanswered.length} questions have no answer. Submit now?`))return;finishExam();return}render()}
function finishExam(){if(!examState||examState.submitted)return;let qs=examState.ids.map(id=>QUESTIONS.find(x=>x.id===id)),score=qs.filter(q=>JSON.stringify([...(examState.answers[q.id]||[])].sort())===JSON.stringify([...q.answers].sort())).length;examState.submitted=true;db.examHistory.push({date:new Date().toLocaleString(),track:examState.track,score,total:qs.length,percent:Math.round(score/qs.length*100)});save();render()}
document.addEventListener('change',e=>{if(e.target.name!=='exam-answer'||!examState||examState.submitted)return;let q=getExamQ(),vals=[...document.querySelectorAll('input[name="exam-answer"]:checked')].map(x=>Number(x.value));examState.answers[q.id]=vals;if(examState.mode==='practice'&&examState.checked?.[q.id])delete examState.checked[q.id];render()});
function startTimer(){clearInterval(examClock);if(!examState||examState.submitted||!examState.minutes)return;const update=()=>{const remain=Math.max(0,examState.minutes*60-Math.floor((Date.now()-examState.started)/1000)),el=$('examTime');if(el)el.textContent=`${Math.floor(remain/60)}:${String(remain%60).padStart(2,'0')}`;if(remain<=0){clearInterval(examClock);finishExam();toast('Time ended; results recorded.')}};update();examClock=setInterval(update,1000)}

if(!location.hash)location.hash="#/portal/overview";render();</script></body></html>

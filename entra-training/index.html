rder:-1;position:static}}@media(max-width:900px){#menuToggle{display:block}.fluent-shell{grid-template-columns:1fr}.fluent-side{top:52px;left:0;position:fixed;width:245px;z-index:42;transform:translateX(-100%)}.fluent-side.open{transform:translateX(0)}.ms-top-search{display:none}.ms-topbar{gap:10px}.ms-context{padding:10px 15px}.ms-context-right .tiny{display:none}.portal{grid-template-columns:1fr}.portalnav{max-height:210px;overflow:auto;display:flex;gap:0;flex-wrap:wrap;border-bottom:1px solid #ddd}.portalnav .ptitle{width:100%;font-size:13px}.portalnav .searchlabel{width:100%;padding:7px 14px}.portalnav .ms-nav-section{display:none}.portalnav button{width:auto;border-radius:3px;padding:9px}.portalmain{padding:17px}.fluent-workspace .page{padding:12px}.ms-badge{font-size:8px}.ms-topbrand{font-size:14px}.ms-top-actions .ms-icon-button{display:none}}@media(max-width:540px){.ms-profile{display:none}.ms-propertygrid{grid-template-columns:115px 1fr;gap:9px;font-size:11px}.ms-detail-tabs{gap:12px}.ms-topbar{padding:0 8px}.ms-context-left{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.portaltoolbar .btn{font-size:11px}.portalnav{max-height:165px}}
</style></head><body><div id="root"><section style="max-width:840px;margin:50px auto;padding:25px"><h1>Entra Practice Console</h1><p>Your file viewer may block scripts. To practice interactively, open this app through a normal hosted HTTPS address. The complete lesson reader is included in the ZIP.</p></section></div><script>const STUDIO_DATA={"lessons":[{"id":"f-identity","track":"SC-900","domain":"Security concepts","title":"Identity, authentication and authorization","analogy":"A museum badge identifies the visitor; the ticket scanner authenticates it; the exhibit permissions authorize which doors open.","concept":"An identity is a record representing a person, device or application. Authentication is evidence that a claimant controls that identity. Authorization evaluates whether that already-authenticated identity can perform a requested action. An identity provider (IdP) creates and validates identities; a service provider relies on its assertions or tokens. Never equate a successful sign-in with permission to every resource.","mechanics":"Microsoft Entra ID is a cloud identity provider and directory. Active Directory Domain Services (AD DS) is a Windows directory for many on-premises authentication and policy workloads. A tenant is the identity boundary; a user object is one principal within that tenant. Modern authentication may use tokens rather than sending a password to each application.","example":"Avery signs in to the company directory, but cannot open Finance Reports until the report application or a group grants an appropriate role. A correct password does not confer Finance permissions.","steps":["Identify the principal requesting access","Identify the system that verifies the principal","Identify the resource and its owner","Determine the specific permission needed","Test access for both authorized and unauthorized users"],"trap":"Mistake: saying MFA is authorization. MFA strengthens authentication; role assignment and app policy determine authorization.","lab":"lab-users","url":"","minutes":40},{"id":"f-zero","track":"SC-900","domain":"Security concepts","title":"Zero Trust, shared responsibility and defense in depth","analogy":"An airport checks the boarding pass again at each security boundary, even if the traveler passed the previous checkpoint.","concept":"Zero Trust is not a product. The principles are verify explicitly, use least privilege and assume breach. Shared responsibility means cloud providers secure some layers while customers still own their data, identities, access policies and workload configurations. Defense in depth uses multiple independent controls so one failure is not catastrophic.","mechanics":"A practical identity posture combines phishing-resistant sign-in, conditional access, limited administrator rights, logging, approvals and recurring access reviews. Encryption protects data confidentiality; hashing produces a one-way digest used for verification or integrity depending on context. Governance, risk and compliance (GRC) aligns controls with business obligations and risk tolerance.","example":"A stolen employee password should not immediately grant payroll data access: MFA or a passkey, a managed-device requirement, sensitive app entitlements and risk monitoring provide different layers of resistance.","steps":["Draw five security layers protecting one payroll app","Mark which duties belong to your organization and the provider","Choose a least-privilege access model","Define a signal that should trigger extra verification","Describe what evidence an auditor could inspect"],"trap":"Zero Trust does not mean block everything; it means continually make access decisions using appropriate signals.","lab":"lab-policy","url":"","minutes":40},{"id":"f-entra","track":"SC-900","domain":"Microsoft Entra","title":"The Entra family and identity types","analogy":"A directory is the employee roster; a tenant is the company campus; groups are departments; app identities are service badges for machines.","concept":"Microsoft Entra ID provides cloud authentication, authorization foundations and directory information. Member users, guest identities, service principals and managed identities serve different purposes. Hybrid identity connects existing AD DS accounts with cloud identity; the directory source of authority matters for updates and troubleshooting.","mechanics":"Separate access management from identity protection and governance: Conditional Access decides the conditions of sign-in; ID Protection evaluates certain identity risk signals; governance manages who receives and retains access; Privileged Identity Management (PIM) controls time-bound elevated permissions. Features and licenses differ: do not assume that every lab capability is free in a real tenant.","example":"A contractor invited as a guest can collaborate with a project team without receiving a permanent full employee identity. A background Azure function should use a managed identity rather than a shared human account when supported.","steps":["Classify four sample principals as member, guest or workload","Find users and groups in the practice tenant","Identify a feature that decides sign-in conditions","Identify a feature that reviews continuing access","Explain which identity should own an automated workload"],"trap":"An enterprise application object (service principal) is not identical to its application registration; they represent different parts of an application’s identity.","lab":"lab-guest","url":"","minutes":40},{"id":"f-security","track":"SC-900","domain":"Microsoft security","title":"Azure security services and Microsoft Defender","analogy":"A secure office needs perimeter gates, locked rooms, cameras, incident investigators and a disaster plan—not a single giant padlock.","concept":"Azure DDoS Protection targets distributed denial-of-service attacks, Azure Firewall filters network traffic, Web Application Firewall protects common HTTP(S) web application threats, network security groups apply subnet or interface rules, and Azure Bastion provides managed remote access to VMs. Key Vault stores secrets, keys and certificates with access controls. Defender for Cloud helps evaluate cloud posture and workload protection.","mechanics":"Defender XDR brings together threat signals from Microsoft Defender for Endpoint, Office 365, Identity and Cloud Apps. Defender for Cloud Apps helps govern SaaS usage and app sessions. Microsoft Sentinel is a SIEM/SOAR platform for log analysis and response automation. Understand which product provides which control before designing integrations.","example":"A malicious OAuth app requesting mailbox permissions belongs in cloud-app governance; a compromised laptop belongs in endpoint detection; a broad incident correlating both may be investigated using XDR and a SIEM.","steps":["Match an attack to the correct Azure protection control","Separate CSPM from workload threat protection","Sketch Defender XDR to Sentinel data flow","Explain a SIEM alert versus a SOAR playbook","Choose a first-response priority in a combined identity/device incident"],"trap":"Do not use Sentinel as a substitute for every individual prevention control; it primarily helps detect, investigate and automate response.","lab":"lab-defender","url":"","minutes":40},{"id":"f-purview","track":"SC-900","domain":"Compliance","title":"Purview, data protection and privacy","analogy":"Security decides who enters the library; data governance decides which books contain secrets and how long records must be kept.","concept":"Microsoft Purview addresses data classification, sensitivity labels, data loss prevention (DLP), retention, records management, auditing, eDiscovery and insider risk. Compliance Manager provides improvement actions and assessments; a compliance score is a posture indicator rather than proof of legal compliance. The Service Trust Portal provides Microsoft compliance and audit documents subject to access rights.","mechanics":"A sensitivity label identifies and can protect sensitive information. DLP policies seek to prevent inappropriate transmission or use. Retention policies and labels define preservation or disposition schedules. eDiscovery supports legal investigation; audit logs capture relevant activity. Privacy principles include collection limits, appropriate use and transparency.","example":"Human Resources must label employee records, retain them for an approved period and alert when sensitive files are shared outside the organization. Identity permissions and Purview controls reinforce one another rather than replacing each other.","steps":["Classify a sample dataset as public, internal or confidential","Pick a sensitivity label strategy","Define a DLP rule for external sharing","Specify retention and legal-hold behavior","Identify which audit record would verify a policy action"],"trap":"Compliance Score is not a certification that the organization fully meets a law or standard.","lab":"lab-blueprint","url":"","minutes":40},{"id":"f-protocols","track":"SC-900","domain":"Security concepts","title":"How SSO, OAuth, OIDC and SAML differ","analogy":"SSO is the experience of using one trusted check-in to enter several venues; the protocol is the language used between the doors.","concept":"SAML commonly carries signed XML assertions for enterprise browser SSO. OAuth 2.0 is a framework for delegated authorization: an application obtains scoped access tokens to call a resource. OpenID Connect (OIDC) adds an authentication and identity layer over OAuth, often through ID tokens. SCIM is a provisioning protocol for creating and deprovisioning users and groups; it is not a sign-in protocol.","mechanics":"Always ask which party is the user, identity provider, application (client) and resource server. An access token is intended for a resource, while an ID token describes an authentication event to the client. Token signature, audience, issuer, lifetime and permissions must be validated. A redirect URI should match a registered value to protect the authorization flow.","example":"A company integrates a SaaS HR portal using SAML for sign-in and SCIM for automatic staff provisioning. An internal API uses OIDC for login and OAuth tokens to call protected API endpoints.","steps":["Draw the actors of an OIDC authorization code flow","Point to the identity provider and relying party","Label the access token recipient and audience","Choose SAML or OIDC for a sample SSO integration","Explain which part SCIM handles"],"trap":"An OAuth access token is not a general-purpose proof of user login to every application.","lab":"lab-app","url":"","minutes":40},{"id":"i-tenant","track":"SC-300","domain":"User identities","title":"Tenant settings, administrative units and roles","analogy":"The headquarters controls enterprise-wide policy; regional administrators can receive limited management scope.","concept":"A Microsoft Entra tenant contains directory-wide settings such as default domain, verified domains, user permissions, group settings, device settings and company branding. Administrative units allow selected admins to manage scoped sets of users, groups or devices. A role assignment alone does not prove that an admin has unlimited scope—evaluate role definition, assignment scope and any PIM activation.","mechanics":"In Entra, Global Administrator is powerful and should be tightly limited. Use narrow built-in roles, custom roles where appropriate and just-in-time eligible assignments for high-risk administration. Administrative units scope supported management capabilities; they do not create a separate tenant or automatically isolate every policy.","example":"A global organization lets a regional Helpdesk Administrator reset eligible accounts inside a regional administrative unit, without granting company-wide identity administrator privileges.","steps":["Inspect tenant settings and verified domain concept","Create a regional administrative unit","Choose a least-privileged role","Assign the role with the intended scope","Verify the scope and document a rollback plan"],"trap":"Administrative units cannot substitute for authorization testing on every product and resource.","lab":"lab-au","url":"","minutes":40},{"id":"i-users","track":"SC-300","domain":"User identities","title":"Users, groups, licenses and bulk operations","analogy":"A user is an employee record; group membership is a department assignment; licensing is a separate service entitlement.","concept":"User lifecycle includes creation, profile updates, authentication method enrollment, group membership, disabling and deletion. Security groups are commonly used for application access and policy targeting. Group types and membership rules matter: manually assigned groups differ from dynamic memberships evaluated from attributes. Licensing may be directly assigned or group-based, depending on available service capabilities.","mechanics":"Bulk tasks use controlled CSV input or Microsoft Graph PowerShell automation. Validate attributes, name collisions, licensing inventory and permissions before processing real identities. A safe automation sequence is inspect, validate, preview changes, apply to a small test group and audit results. Devices may be registered, joined or hybrid joined; these states affect authentication and access decisions.","example":"A new Finance analyst receives a member account, the Finance-Restricted security group and a suitable service license; disabling the account later should trigger an access review and session revocation if risk warrants.","steps":["Create the employee Avery Lane","Create a Finance-Restricted security group","Add Avery to the group","Compare direct versus group-based license models","Explain how to export audit evidence for the changes"],"trap":"A group membership change may not immediately invalidate every token or session; consider revocation and token behavior.","lab":"lab-users","url":"","minutes":40},{"id":"i-attributes","track":"SC-300","domain":"User identities","title":"Custom security attributes and identity classification","analogy":"Adding a department label to a badge is not the same as granting clearance to the department.","concept":"Custom security attributes add schema-based attributes to objects for authorization and governance scenarios. Define attribute sets, permitted data types and assignment authorization. They are separate from ordinary profile attributes such as department and from security group membership. They are not automatically a drop-in replacement for access policy targeting.","mechanics":"Before creating attributes, write a controlled vocabulary and decide which service can populate and update values. Apply minimal delegated rights to readers and assigners. Document how an attribute becomes authoritative and how stale or sensitive values will be handled.","example":"An organization tags approved business applications with a cost-center or risk classification, then uses controlled automation and reviews to keep that metadata accurate.","steps":["Choose a security classification attribute","Define accepted values and who can update it","Apply the attribute to a sample app","Describe a use case in a security workflow","Verify the attribute cannot be casually modified by ordinary users"],"trap":"Avoid putting secret values in attributes; metadata can have visibility and logging consequences.","lab":"lab-attributes","url":"","minutes":40},{"id":"i-external","track":"SC-300","domain":"User identities","title":"Guest collaboration, cross-tenant access and federation","analogy":"Visitors can enter a building for one project without becoming permanent employees.","concept":"Microsoft Entra B2B collaboration lets external users access selected organizational resources. Cross-tenant access settings govern inbound and outbound collaboration behavior. Cross-tenant synchronization can automate suitable lifecycle processes between tenant organizations. External identity providers can use supported federation protocols; understand what trust is being established before enabling it.","mechanics":"A sound design considers invitation restrictions, tenant allow/deny strategy, MFA and device claims, access packages, sponsorship, automatic expiration and review. Tenant-level collaboration defaults and application assignments are different controls; set both intentionally.","example":"A consulting partner needs access to one project application for 60 days. You invite a guest, assign only that app or package, and schedule a review instead of giving them a full employee role.","steps":["Invite a mock partner as a guest","Choose the permitted application","Describe inbound and outbound trust","Add a time-bound review requirement","Test that the guest cannot open an unrelated finance application"],"trap":"Trusting an external tenant MFA claim does not mean all external sign-ins are automatically safe; verify claims and your own policies.","lab":"lab-guest","url":"","minutes":40},{"id":"i-hybrid","track":"SC-300","domain":"User identities","title":"Hybrid identity, Connect Sync and Cloud Sync","analogy":"Think of a source-of-truth register copied to other offices; you must know which copy is allowed to make edits.","concept":"Organizations with AD DS may synchronize accounts to Entra ID using Microsoft Entra Connect Sync or Cloud Sync, selected according to supported topology and requirements. Password hash synchronization (PHS) lets Entra validate a derived password hash in the cloud; pass-through authentication (PTA) uses on-premises agents. Seamless SSO can reduce repeat sign-ins for suitable domain-joined clients.","mechanics":"Migration away from AD FS requires application inventory, federation dependency evaluation, staged cutover, recovery planning and monitoring. Connect Health provides insights for supported hybrid components. Hybrid troubleshooting begins with source object, sync scope, join rules, attribute conflicts and sign-in method—not simply deleting and recreating identities.","example":"A 10,000-person company has AD DS accounts and Microsoft 365. You document the authentication source, sync engine, update direction, rollback and alerting before migrating federation.","steps":["Map AD DS and Entra authority for three attributes","Choose PHS or PTA for a scenario","Simulate a duplicate UPN sync issue","Select a reconciliation approach","Write a safe AD FS migration checkpoint"],"trap":"Synchronization is not a backup plan; do not treat disabling sync as an instant safe rollback.","lab":"lab-hybrid","url":"","minutes":40},{"id":"a-auth","track":"SC-300","domain":"Authentication & access","title":"MFA, passkeys, Temporary Access Pass and certificate methods","analogy":"A keyless badge is convenient, but the enrollment and recovery process decide whether it is actually trustworthy.","concept":"A passkey based on FIDO2/WebAuthn can resist phishing by binding authentication to the legitimate service origin; Windows Hello for Business uses device-associated cryptographic keys. Microsoft Authenticator, certificate-based authentication, security keys and Temporary Access Pass (TAP) support different enrollment and recovery scenarios. Authentication strengths can require specific methods for sensitive resources.","mechanics":"Roll out passwordless with method eligibility groups, pilot enrollment, platform compatibility, user communication, helpdesk recovery and sign-in audit monitoring. TAP is time-limited bootstrap/recovery access, not a permanent replacement for authentication policy. Administrators should avoid policies that lock every privileged account out; test emergency access paths.","example":"A new analyst without a registered security key receives an approved one-time TAP, enrolls a passkey on their managed device, then uses the passkey to reach an internal high-value app.","steps":["Inspect authentication methods policy","Enable passkeys for a pilot cohort","Create a TAP for a sample user","Plan a passwordless registration check","Explain why phishing resistance differs from generic MFA"],"trap":"Push-based MFA can be vulnerable to fatigue and social engineering; requiring MFA alone does not guarantee phishing resistance.","lab":"lab-methods","url":"","minutes":40},{"id":"a-recovery","track":"SC-300","domain":"Authentication & access","title":"SSPR, password protection and session revocation","analogy":"When a badge is lost, recovering access must not be easier to attack than the original sign-in.","concept":"Self-service password reset (SSPR) combines policy scope, registered authentication methods and recovery requirements. Entra Password Protection can block weak or custom banned passwords, with hybrid options under documented prerequisites. Administrators need to know the difference between disabling an account, resetting credentials and revoking refresh sessions; token and session behavior can vary across applications.","mechanics":"A safe compromised-account response includes investigating risk, blocking or disabling sign-in as appropriate, resetting credentials, revoking relevant sessions, confirming MFA re-enrollment if needed and validating restored access. Separate ordinary helpdesk recovery from administrator emergency access.","example":"A risky sign-in is detected from an unfamiliar location. You preserve logs, evaluate whether the user is compromised, revoke sessions and require a secure recovery flow.","steps":["Identify the account-recovery threat","Choose recovery methods and minimum registration","Inspect a flagged sign-in","Revoke mock sessions for the user","Document the intended validation and user communication"],"trap":"A password reset alone is not a guaranteed way to instantly terminate every existing application session.","lab":"lab-risk","url":"","minutes":40},{"id":"a-ca","track":"SC-300","domain":"Authentication & access","title":"Conditional Access policies and safe rollout","analogy":"A security gate checks WHO, WHAT, WHERE and DEVICE before deciding whether access needs extra proof.","concept":"Conditional Access policies evaluate assignments (users/groups and resources), conditions (such as locations, device platforms or risk) and access or session controls. Policies apply together; a matching block policy blocks access, and requirements from applicable grant policies must be satisfied. Exclusions and emergency access design are critical. Policy outcomes can differ from simply choosing one rule, so validate with What If and sign-in logs.","mechanics":"A production rollout should define the business case, exclusions, expected sign-in impact, license prerequisites, pilot group, report-only observation period, support plan and rollback criteria. Report-only shows impact without enforcing most grant decisions. When deploying risk-based policies, confirm appropriate licensing and sign-in/user risk data availability.","example":"Finance access from unmanaged devices should require stronger authentication, and high-risk events may be blocked. Start with a finance pilot in report-only before an approved staged rollout.","steps":["Create Finance-Restricted users and sample app","Build a finance MFA Conditional Access policy","Set it to report-only","Run What If with different users and device states","Verify block precedence and document what would happen before enabling"],"trap":"Do not create an all-users block policy without carefully planned emergency access and validated exclusions.","lab":"lab-policy","url":"","minutes":40},{"id":"a-context","track":"SC-300","domain":"Authentication & access","title":"Authentication context, protected actions and session controls","analogy":"Not every room in a building needs the same check; a vault door can require stronger verification mid-visit.","concept":"Authentication context can mark specific application actions or resources for higher assurance. Protected actions in Entra can require a Conditional Access authentication context before selected administrative actions. Session controls include sign-in frequency, persistent browser behavior and integrations to control access in compatible applications. Continuous access evaluation (CAE) can help supported resources react to certain changes more rapidly.","mechanics":"Use app-owner requirements to determine which operations justify step-up authentication. Verify app and client compatibility, how controls are invoked, and what logs reveal. Not all apps or token flows support every session feature. Avoid turning a sign-in control into an application authorization substitute.","example":"Employees may use basic authentication strength for viewing expense reports but require phishing-resistant authentication when exporting sensitive payroll data.","steps":["Identify high-value protected action","Define desired authentication strength","Sketch context to policy evaluation path","List app and client compatibility checks","Choose session control and evidence to confirm behavior"],"trap":"CAE is not universal instantaneous revocation in every app and token scenario.","lab":"lab-policy","url":"","minutes":40},{"id":"a-risk","track":"SC-300","domain":"Authentication & access","title":"Identity Protection: users, sign-ins and workload risk","analogy":"A security officer distinguishes a stolen badge (user risk) from a suspicious entrance attempt (sign-in risk).","concept":"Microsoft Entra ID Protection can identify certain risky user and sign-in patterns. User risk represents the likelihood an identity is compromised; sign-in risk focuses on an authentication attempt. Responses may include remediating risky users, investigating events and applying risk-based Conditional Access controls. Risk detection visibility and automatic policies depend on licensing.","mechanics":"For each event, assess who, when, source IP/location, device, client application, authentication method and Conditional Access result. Preserve evidence; distinguish false positives from confirmed compromise. Workload identity risk also matters when service principals or automation identities become suspicious.","example":"A payroll admin has impossible-travel alerts. The correct investigation correlates the sign-in records, associated device and access changes before declaring the account compromised.","steps":["Open the seeded risky sign-in","Identify three meaningful suspicious signals","Choose triage and response severity","Record an investigation conclusion","Explain how risk-based Conditional Access could remediate"],"trap":"A risky sign-in is a risk signal, not definitive proof of a successful breach.","lab":"lab-risk","url":"","minutes":40},{"id":"a-gsa","track":"SC-300","domain":"Authentication & access","title":"Global Secure Access: Internet Access and Private Access","analogy":"Instead of a broad VPN tunnel, secure access can be tailored to specific private resources and internet destinations.","concept":"Microsoft Entra Global Secure Access includes Entra Private Access for identity-aware access to suitable private resources and Entra Internet Access capabilities for supported traffic and secure web access scenarios. Deployment uses traffic profiles, client configuration and appropriate policy/connector design. Plan whether Microsoft 365 traffic and third-party internet traffic need different handling.","mechanics":"Validate supported endpoints, networks, DNS and certificate requirements, connector placement and change rollback before redirecting traffic. Evaluate client health, traffic logs and Conditional Access interactions. This is not simply another user-group permission setting; networking and routing dependencies matter.","example":"A partner needs access to one internal payroll web app without a full network VPN. Assess Private Access as part of a Zero Trust access design and pilot the client/connector deployment.","steps":["Choose which app requires private connectivity","Describe connector and client responsibilities","Create a mock traffic profile","Select a permitted group","Write a validation and rollback checklist"],"trap":"Turning on a traffic profile in the simulator does not deploy an actual network tunnel or security service.","lab":"lab-gsa","url":"","minutes":40},{"id":"w-workload","track":"SC-300","domain":"Workload identities","title":"Service principals, managed identities and Azure resource access","analogy":"A background service needs its own badge; borrowing an employee’s password creates risk and accountability problems.","concept":"An app registration describes an application identity configuration. A service principal is its local enterprise representation in a tenant. Managed identities are Azure-managed workload identities used by supporting Azure services, reducing credential management overhead. System-assigned identities are tied to the lifecycle of their resource; user-assigned identities may be reused by resources.","mechanics":"Authorization still matters: identity creation does not automatically grant API, storage or Key Vault permissions. Assign the least-privilege Azure RBAC role or resource-specific permissions at the smallest workable scope. Monitor identity usage and avoid static secrets where a supported federation or managed identity option exists.","example":"A scheduled Azure function reads a single Key Vault secret. Give its managed identity only the necessary vault permissions, not Contributor to the subscription.","steps":["Compare a user account, service principal and managed identity","Create a mock managed identity","Associate it with a sample Azure resource","Choose least-privilege resource permission","Validate access and log intended behavior"],"trap":"A managed identity is not a universal credential usable from any machine without a supported trust or federation design.","lab":"lab-managed","url":"","minutes":40},{"id":"w-apps","track":"SC-300","domain":"Workload identities","title":"Enterprise applications, SSO, SCIM and Application Proxy","analogy":"Registering an app in a catalog, letting someone sign in and automatically provisioning their account are separate processes.","concept":"Enterprise applications represent service principals and local settings for connected apps. You can manage assignment requirements, users/groups, SSO, provisioning and app consent as applicable. SAML and OIDC enable sign-in use cases; SCIM automates account lifecycle for supported SaaS applications. Application Proxy can publish suitable on-premises web applications through connectors, with authentication and network design prerequisites.","mechanics":"First learn who owns the app, which users need access, sign-in protocol, metadata URLs, claims, provisioning scope, and offboarding needs. For SaaS integration, use test users and verify both successful and denied sign-in. An enterprise application is not automatically safe just because it appears in the directory.","example":"Onboard Vendor Portal for Finance: create the enterprise app, choose SAML, assign a restricted group and write an offboarding procedure.","steps":["Create Vendor Portal application","Set SSO mode to SAML","Assign Finance-Restricted group","Plan attribute provisioning and deprovisioning","Verify unauthorized users are refused access"],"trap":"SAML configuration alone does not create accounts in the target SaaS application; distinguish just-in-time creation from SCIM provisioning.","lab":"lab-app","url":"","minutes":40},{"id":"w-reg","track":"SC-300","domain":"Workload identities","title":"App registrations, delegated permissions and admin consent","analogy":"An app asking for access to every mailbox is not equivalent to a user consenting to read only their own calendar.","concept":"Microsoft Graph applications request delegated scopes on behalf of signed-in users or application permissions running without a user. Configure supported account types, redirect URIs, credentials or certificates, app roles and API permissions with the principle of least privilege. Admin consent may be required for sensitive permissions and tenant-wide authorization.","mechanics":"Choose an authentication flow based on app type; avoid embedded credentials and untrusted redirect URIs. Record who approved each scope, why it is needed and how it will be reviewed or removed. Watch for high-privilege OAuth permissions and misuse of service principals.","example":"Finance API only needs to read authenticated users’ profiles. Request a narrowly scoped delegated permission rather than a broad application permission over the directory.","steps":["Create a Finance API app registration","Choose the appropriate supported account type","Add a redirect URI for an authorized sample client","Select a narrow Graph permission","Explain consent and grant boundaries"],"trap":"Do not confuse a configured API permission with an actual granted consent or with authorization to a separate resource.","lab":"lab-reg","url":"","minutes":40},{"id":"w-cloudapps","track":"SC-300","domain":"Workload identities","title":"Defender for Cloud Apps and OAuth app governance","analogy":"A company can approve the front door yet unknowingly expose data through a connected third-party app.","concept":"Defender for Cloud Apps helps discover SaaS usage, catalog applications, review connected apps and govern session behavior for supported scenarios. Policies can detect risky cloud use and certain OAuth app risks. Conditional Access App Control can mediate compatible app sessions with a reverse-proxy or other supported integration pattern.","mechanics":"An investigation combines application permissions, publisher verification where available, consent time, user impact, usage frequency and alert severity. Remediation may include blocking an OAuth app, revoking grants, reviewing affected users and ensuring legitimate business workflows have alternatives.","example":"An unreviewed OAuth app asks for organization-wide file permissions. You investigate its requests and recommend blocking or tightening permissions rather than immediately granting consent.","steps":["Inspect the practice OAuth alert","Review requested permissions and app owner","Classify the risk","Record a deny or approval decision","Document which users may need follow-up"],"trap":"Cloud app discovery and policy enforcement depend on integration, licensing and supported traffic visibility.","lab":"lab-defender","url":"","minutes":40},{"id":"g-packages","track":"SC-300","domain":"Identity governance","title":"Entitlement management: catalogs and access packages","analogy":"A project kit bundles the required room key, document access and equipment with an approval and return date.","concept":"Entitlement management organizes resource access through catalogs and access packages. Packages can bundle suitable groups, applications or sites and include request policies, approvers, assignment expiration, reviews and external user lifecycle. Catalog resources and assignment policies should reflect data ownership and the business justification.","mechanics":"Design the package from the resource owner backward: who needs it, who approves it, how long it lasts, what happens when employment or project status changes, and what evidence is retained. For guest contractors, consider connected organizations and guest lifecycle controls.","example":"A 60-day contractor project requires Vendor Portal and a project team; an access package routes approval to the sponsor, grants both resources and expires automatically.","steps":["Create a Finance Contractor package","Choose its eligible audience","Set a sample approval requirement","Add expiration and review expectations","Explain how removal would be verified"],"trap":"An access package assignment policy must be checked against the actual protected resource permissions; packaging alone is not enforcement.","lab":"lab-package","url":"","minutes":40},{"id":"g-reviews","track":"SC-300","domain":"Identity governance","title":"Access reviews and least-privilege recertification","analogy":"A visitor list becomes unsafe when former visitors keep keys indefinitely.","concept":"Access reviews help designated reviewers reassess memberships or application entitlements. Scope, reviewers, recurrence, decision handling, auto-apply behavior, notification and evidence all require deliberate design. This is an operational governance process; a periodic review cannot replace immediate termination response.","mechanics":"Test review outcomes on sample users, especially denied or nonresponsive cases. Keep a defensible audit trail: reviewer identity, decision date, justification and whether revocation succeeded. Decide whether owners or managers have appropriate context to approve each entitlement.","example":"A quarterly Finance group review asks each manager to confirm ongoing access. A departed contractor should be denied and removed, with an exception process for business-critical users.","steps":["Create a quarterly Finance access review","Pick the reviewer and target group","Record a revoke decision for obsolete access","Confirm the audit trail and removal behavior","Specify how nonresponse should be handled"],"trap":"Do not treat the review itself as proof that permissions were removed; verify the resulting application or group state.","lab":"lab-review","url":"","minutes":40},{"id":"g-pim","track":"SC-300","domain":"Identity governance","title":"Privileged Identity Management, eligibility and emergency access","analogy":"A technician carries a toolbox every day but gets the master key only for a supervised task.","concept":"Privileged Identity Management (PIM) supports eligible and time-bound activations for certain roles and resource assignments. Security controls may include activation justification, approval, MFA requirements, notification and audit history. PIM for Groups can govern eligibility for group membership or ownership in applicable scenarios.","mechanics":"Evaluate privilege by its effective access and scope. A well-designed plan limits standing privileges, protects emergency access accounts, documents break-glass validation and tests incident conditions. Emergency accounts require a different recovery strategy from normal privileged-user policy, with auditing and appropriate safeguards.","example":"A security operator needs the Conditional Access Administrator role for one hour to fix a policy. An eligible PIM assignment permits timed activation rather than permanent standing admin rights.","steps":["Configure mock PIM eligibility","Choose a narrow role and activation window","Activate and verify time-bound privilege","Review the activation audit log","Explain emergency account checks and protection"],"trap":"PIM approval does not remove the need for separation of duties, change control and role scoping.","lab":"lab-pim","url":"","minutes":40},{"id":"g-logs","track":"SC-300","domain":"Identity governance","title":"Sign-in logs, audit logs, KQL and diagnostics","analogy":"A security camera shows entry; an administrative audit log shows who changed the locks.","concept":"Sign-in logs track authentication events, risk and policy outcomes; audit logs track configuration changes; provisioning logs help diagnose synchronization or application account lifecycle. Diagnostic settings can export eligible logs to destinations such as Log Analytics, storage or event streaming depending on service and license. KQL lets analysts filter and summarize structured events.","mechanics":"For a failed sign-in, identify account, timestamp, app, correlation IDs, Conditional Access policy result, device state and error detail. Correlate an audit change to a later access problem. Use time ranges and only the fields your source actually contains; do not mistake the practice log data for live Microsoft schema availability.","example":"A user is denied Finance access just after a policy edit. Compare the sign-in outcome to the audit log actor and time before changing production policy.","steps":["Filter sample sign-ins by failure","Find the denied Finance attempt","Inspect policy and device details","Run the supplied simplified KQL-style filter","Explain how you would retain and export evidence"],"trap":"A successful sign-in does not prove that the requested resource action was authorized; distinguish sign-in success and app-level permissions.","lab":"lab-logs","url":"","minutes":40},{"id":"x-resilience","track":"SC-100","domain":"Strategic security","title":"Ransomware resilience and business continuity","analogy":"When one floor loses power, the emergency plan must keep critical services and recovery credentials independent.","concept":"Resiliency design identifies business-critical assets and recovery objectives, then prioritizes identity, backups, patching and incident response. Business continuity and disaster recovery (BCDR) specify RTO and RPO targets appropriate to services. Secure backups require access separation, immutability options and restore testing; isolated identity recovery plans prevent a compromised administrator from controlling every backup.","mechanics":"A ransomware-focused design includes privileged access protection, attack-path reduction, segmentation, strong monitoring and an exercised restore plan. Put business impact and dependency mapping before picking a product. Different environments need different recovery sequences.","example":"A manufacturing company cannot stop inventory processing for more than four hours. Design prioritized restoration of identity, network connectivity and production systems with tested backups.","steps":["Choose the three crown-jewel services","Define RTO and RPO priorities","Map identity dependencies","Propose segmented recovery administrators","Plan a tabletop test and measurable recovery evidence"],"trap":"Backups that cannot be restored during a realistic incident are not a proven recovery capability.","lab":"lab-blueprint","url":"","minutes":40},{"id":"x-reference","track":"SC-100","domain":"Strategic security","title":"Zero Trust architecture, MCRA, CAF and secure landing zones","analogy":"A building blueprint specifies zones, fire exits, security systems and maintenance rules before walls are erected.","concept":"The Microsoft Cybersecurity Reference Architectures (MCRA) organize capability relationships across identity, infrastructure, apps, data, security operations and governance. The Cloud Adoption Framework (CAF) supports cloud governance and operating-model decisions. The Azure Well-Architected Framework helps evaluate reliability, security, cost, performance and operational excellence. Azure landing zones are repeatable subscription, network and policy foundations.","mechanics":"Treat frameworks as decision tools, not checklists to mechanically tick. Define a threat model and stakeholder priorities, then map recommended controls to risks, constraints and measurable outcomes. Secure AI adoption requires data boundaries, identity and authorization for agents, prompt or tool abuse considerations and monitoring.","example":"A global retailer needs a standard architecture for new Azure applications. You propose landing zones, policy guardrails and management groups with shared visibility and delegated teams.","steps":["Document business drivers and constraints","Map the proposed control layers","Choose landing zone governance guardrails","Add risk and monitoring capabilities","Explain tradeoffs to business leadership"],"trap":"Copying a reference diagram without addressing organizational dependencies is not an architectural design.","lab":"lab-blueprint","url":"","minutes":40},{"id":"x-ops","track":"SC-100","domain":"Security operations","title":"XDR, Sentinel, threat detection and response design","analogy":"Security sensors see different parts of the attack; the incident team needs one correlated view and an action playbook.","concept":"An architect defines telemetry coverage, retention, access to logs, detection strategy, incident triage and automated response. Microsoft Defender XDR supports correlated Microsoft threat signals, while Microsoft Sentinel offers SIEM and SOAR patterns for multi-source logs. Design for people and processes: staffing, severity, runbooks and after-action review.","mechanics":"MITRE ATT&CK helps communicate attacker techniques and detection gaps. Audit logging, cloud and endpoint signals should be correlated by identity and asset identifiers. Choose automation for high-confidence, reversible steps before allowing high-impact actions.","example":"A phishing compromise leads to unusual application consent and cloud file access. Design the correlation rule, investigation steps, containment sequence and communications.","steps":["Identify telemetry across four attack stages","Map each signal to an owning product","Prioritize a detection and response workflow","Choose a low-risk automation","Define how to measure alert quality and response time"],"trap":"More alerts are not necessarily better detection; false positives and analyst burden matter.","lab":"lab-defender","url":"","minutes":40},{"id":"x-iam","track":"SC-100","domain":"Security operations","title":"Enterprise identity architecture, external access and Agent ID","analogy":"An architect decides how every identity—from employee to autonomous tool—earns and loses the right to act.","concept":"Enterprise IAM architecture includes user lifecycle, authentication, delegation, federation, B2B, workload identities and governance for hybrid and multicloud access. Microsoft Entra Agent ID addresses emerging identity governance for AI agents, but implementation details and availability evolve; verify current documentation before real deployment. Modern authentication design considers phishing resistance, CAE, authentication context and protected actions.","mechanics":"Architects must plan migrations, platform limits, vendor dependencies, identity proofing, outage and recovery paths, regional operations and executive risk decisions. Apply an enterprise access model to separate control plane, management plane and data/application operations.","example":"An organization moves from disparate regional identity providers to Entra-based workforce access, while allowing contractors and AI agents only scoped permissions and auditability.","steps":["Draw trust boundaries for humans and workloads","Create an identity lifecycle matrix","Define privileged-access architecture","Plan external access recertification","Describe agent identity authorization and audit risks"],"trap":"A named agent identity is only the beginning; tool/resource authorization and action auditing remain necessary.","lab":"lab-blueprint","url":"","minutes":40},{"id":"x-privilege","track":"SC-100","domain":"Security operations","title":"Securing privileged administrators and secrets","analogy":"A master key never belongs in every employee desk drawer, even if those employees are trusted.","concept":"Securing privileged access spans least-privilege directory roles, just-in-time access, dedicated administrative workstations, protected management paths, strong authentication and audited access reviews. Secrets, keys and certificates need lifecycle ownership, access controls, rotation and incident response. Cloud infrastructure entitlement management helps identify excessive privileges in supported environments.","mechanics":"Choose role segregation by function, scope and business necessity. Review PIM and identity governance effectiveness rather than merely confirming they are licensed. Harden AD DS against replication privilege misuse, credential theft and unsecured admin paths; privileged management should not depend on ordinary endpoint trust.","example":"A helpdesk operator needs password reset but not global tenant administrator privileges. Design the delegated scope, activation conditions, monitoring and escalation procedure.","steps":["List the current standing admins and privilege risks","Reduce each role to required actions","Define privileged workstation standards","Specify PIM and emergency access pattern","Plan periodic evidence review"],"trap":"Moving permanent Global Administrator rights behind MFA alone does not satisfy least-privilege design.","lab":"lab-pim","url":"","minutes":40},{"id":"x-compliance","track":"SC-100","domain":"Security operations","title":"Compliance architecture with Purview, Azure Policy and Defender","analogy":"Policies are meaningful only if controls are mapped to risks and evidence demonstrates that they work.","concept":"An architect translates regulatory obligations into technical and administrative controls with owners, evidence and exception procedures. Microsoft Purview supports data governance and compliance capabilities; Azure Policy can evaluate or constrain specified Azure resource configurations; Defender for Cloud can help assess supported security posture and standards mappings.","mechanics":"Distinguish preventive policies from detective monitoring and compensating controls. Work with legal and privacy stakeholders on scope, retention, data residency and access. Build an evidence process that captures what changed, when, by whom and with what approval.","example":"An organization must demonstrate that sensitive customer exports are restricted and reviewed. Map identity policy, Purview controls, log evidence and recurring review to a control statement.","steps":["Write a testable security control objective","Choose prevention and detection controls","Identify owners and evidence sources","Describe an exception process","Produce a sample audit evidence checklist"],"trap":"A vendor product compliance dashboard does not automatically satisfy every legal requirement.","lab":"lab-blueprint","url":"","minutes":40},{"id":"x-posture","track":"SC-100","domain":"Infrastructure security","title":"Defender for Cloud, Azure Arc, security posture and attack paths","analogy":"A building inspection counts weak doors and shows which weaknesses connect to valuable rooms.","concept":"Cloud Security Posture Management (CSPM) assesses resource configurations and risk trends. Defender for Cloud offers recommendations and protection plans for supported workloads. Azure Arc extends eligible management capabilities to hybrid/multicloud servers and other resources. Exposure Management attack paths prioritize weaknesses that allow attackers to reach important assets.","mechanics":"Architecting posture management means setting ownership, integrating inventory, defining remediation SLAs and measuring risk reduction over time. Microsoft Secure Score and other scores are prioritization aids, not guarantees of safety. External Attack Surface Management (EASM) helps locate internet-exposed assets; validate scope before treating discovery as complete.","example":"An Azure environment has public storage exposure and over-privileged service identities. Prioritize paths leading from an exposed app to sensitive data, then assign remediations with evidence.","steps":["Inventory cloud and hybrid assets","Select posture checks aligned with risks","Map an attack path between exposures","Rank remediations by impact and effort","Define a posture trend metric"],"trap":"Maximizing a score without business context may misprioritize more important risks.","lab":"lab-blueprint","url":"","minutes":40},{"id":"x-endpoints","track":"SC-100","domain":"Infrastructure security","title":"Endpoint, server, IoT/OT and access baselines","analogy":"Different equipment needs different protections: an office laptop is not an industrial controller.","concept":"Security architecture for clients and servers includes hardening, endpoint detection, vulnerability management, patching, device compliance, privileged endpoint access and Windows LAPS where appropriate. IoT and operational technology (OT) require careful asset discovery, safety constraints and network segmentation, often with compensating monitoring where traditional agents cannot run.","mechanics":"Define minimum baselines by operating system, criticality and exposure; use Intune or suitable management platforms for compatible devices. Defense for industrial control systems may include Defender for IoT and specialized network visibility. Secure admin workstations should be isolated from routine browsing and email tasks.","example":"A hospital runs Windows laptops and legacy clinical devices. Avoid assuming every device can be fully patched or run standard security agents; segment and monitor those requiring compensating controls.","steps":["Segment a sample device inventory by risk","Select patching and baseline policy for endpoints","Identify devices requiring compensating controls","Choose a privileged access workstation pattern","Define evidence of compliance"],"trap":"A compliant device does not automatically mean its user is properly authorized for sensitive applications.","lab":"lab-blueprint","url":"","minutes":40},{"id":"x-cloud","track":"SC-100","domain":"Infrastructure security","title":"Cloud workloads, containers and secure network edge","analogy":"Modern applications may span servers, containers and managed services; each segment has its own access and exposure risks.","concept":"Architecture for SaaS, PaaS, IaaS and containers requires workload inventory, secrets management, segmentation, identity controls, image scanning, API policies and monitoring. Network controls may include firewall, WAF, private endpoints, restricted administration and Secure Service Edge (SSE) solutions. Entra Internet Access and Private Access can form part of a broader identity-aware network strategy.","mechanics":"Avoid defaulting to unrestricted public endpoints or shared machine credentials. Define container supply-chain verification and orchestrator access controls. Select networking and identity controls based on actual data flows and failure tolerance; review cost and latency impact.","example":"An internet-facing application calls an internal database through a managed service. Design WAF, private database connectivity, a managed workload identity and centralized logs.","steps":["Draw the data flows and trust boundaries","Mark public and private endpoints","Assign workload identities and access scopes","Recommend container and API defenses","Describe how changes will be tested and rolled back"],"trap":"A WAF does not make vulnerable application code safe; secure development controls still matter.","lab":"lab-gsa","url":"","minutes":40},{"id":"x-m365","track":"SC-100","domain":"Applications & data","title":"Microsoft 365 security, Defender and Intune integration","analogy":"A productivity suite blends identity, documents, collaboration, endpoints and communication threats.","concept":"Microsoft 365 security architecture connects Entra identity, Defender for Office 365, Defender for Cloud Apps, endpoint protection, Intune device policy and Purview data controls. Microsoft Secure Score provides posture recommendations that should be assessed against business context. Copilot data access inherits and exposes underlying permissions; overshared content needs entitlement and data governance review.","mechanics":"A complete design includes email protection, device health, app/session controls, data classification and incident monitoring. Document what is blocked, what is audited and how users report mistakes. Test guest collaboration and external sharing from the user experience.","example":"Before enabling an AI assistant over internal documents, review overshared files, sensitivity labels and search permissions to reduce unintended information exposure.","steps":["Map productivity threats to the right service","Identify a device compliance dependency","Choose protection for phishing and OAuth apps","Design an external file sharing boundary","List Copilot oversharing mitigations"],"trap":"Giving an assistant a new access control is not a substitute for correcting over-permissive documents and sites.","lab":"lab-blueprint","url":"","minutes":40},{"id":"x-appdata","track":"SC-100","domain":"Applications & data","title":"Secure application lifecycles, API security and data platforms","analogy":"Applications have doors, internal plumbing and storage rooms; all three require different safety measures.","concept":"Application security architecture uses threat modeling, secure SDLC, dependency controls, testing, authentication, authorization, API gateways and WAF where suitable. Data architecture requires classification, encryption, secret management, access scopes, backup and monitoring across Azure SQL, Synapse, Cosmos DB, storage and AI services as applicable.","mechanics":"Choose security controls for assets and abuse cases, not vendor labels. Model data flow from user to API to managed database, validate service identity at each trust boundary, and record who can read, write or export data. For AI workloads, consider prompt injection, data leakage through tools and sensitive training or retrieval data.","example":"An internal payroll assistant accesses employee records through an API. Architect user authorization, agent tool scopes, data filtering, Key Vault secrets management and audit evidence.","steps":["Draw a data flow diagram","Identify assets and likely attacker entry points","Assign access controls to each boundary","Plan data encryption and key rotation","Define an abuse-case validation test"],"trap":"Authentication of an API caller is not enough; object-level authorization is still required.","lab":"lab-blueprint","url":"","minutes":40},{"id":"j-duo","track":"ROLE","domain":"Workforce Architect role","title":"Cisco Duo integration and vendor interoperability","analogy":"Different security companies can provide the badge reader and the identity directory; the trust boundary must be explicit.","concept":"Duo can provide MFA and security controls for supported applications and identity environments. Evaluate integration choices by protocol, app support, authenticator policy, device trust, recovery and user experience. With Entra, know which component decides sign-in, which supplies the strong authentication assertion and how Conditional Access interacts with that flow.","mechanics":"Do not assume a third-party MFA signal automatically satisfies every Entra authentication strength requirement. Validate supported integration architecture, claims, registration, logs and licensing against current vendor documentation in a real pilot.","example":"A global organization acquired a business already using Duo. Design the coexistence and staged migration strategy without silently bypassing existing policy or locking out users.","steps":["Inventory Duo-protected apps and endpoints","Identify protocols and SSO flow","Map trust and assertion boundaries","Design compatibility tests for CA requirements","Document fallback and operational support"],"trap":"An external MFA provider and Microsoft native controls may not be interchangeable in every scenario.","lab":"lab-blueprint","url":"","minutes":40},{"id":"j-nist","track":"ROLE","domain":"Workforce Architect role","title":"NIST digital identity and authentication assurance","analogy":"The more valuable the asset, the stronger the evidence needed to prove the right person is asking.","concept":"NIST SP 800-63-4 is a digital identity guideline family that addresses identity proofing, authentication and federation. IAL refers to identity assurance, AAL to authenticator assurance and FAL to federation assurance. These are related but different requirements; a strong authenticator cannot retroactively prove the person enrolled was correctly identity-proofed.","mechanics":"Architects need to map the organization’s risk to assurance requirements and recognize phishing resistance, authenticator lifecycle and recovery. Check the precise standard and current implementation guidance before claiming a control meets a specific assurance level; technology names alone are not compliance proofs.","example":"A financial administrator accesses high-value payroll exports. Explain how authenticator choice, identity verification and federated trust each contribute to assurance.","steps":["Classify proofing, authentication and federation controls","Identify a phishing-resistant method","Define authenticator recovery expectations","Map a sensitive workflow to risk and assurance needs","Document evidence and remaining gaps"],"trap":"MFA is not a blanket synonym for AAL3 or phishing resistance.","lab":"lab-methods","url":"","minutes":40},{"id":"j-emerging","track":"ROLE","domain":"Workforce Architect role","title":"Verified ID, AI agents and new identity patterns","analogy":"A digital employee badge may prove attributes, while an automated agent needs its own traceable authority.","concept":"Microsoft Entra Verified ID involves verifiable credential issuance and presentation for supported identity verification workflows. Agent identities require lifecycle governance, permission boundaries, identity attribution and auditing for AI systems. Both can be part of enterprise identity architecture, but they serve different use cases than ordinary employee sign-in.","mechanics":"Evaluate availability, supported integrations, privacy and data retention before selecting emerging products. Plan credential expiration/revocation and agent ownership, tool access, anomaly detection and action approval. Treat experiments as designs until validated against live documentation and service capabilities.","example":"A contractor proves employment eligibility with a credential, while a vendor-response AI agent reads only approved support tickets and records actions under an accountable owner.","steps":["Explain which problem Verified ID solves","Specify issuer, holder and verifier roles","Define an agent owner and permission scope","Design auditing and revocation paths","List privacy and availability validations"],"trap":"A verifiable credential is not automatically a substitute for an application session token.","lab":"lab-blueprint","url":"","minutes":40},{"id":"j-design","track":"ROLE","domain":"Workforce Architect role","title":"Architecture diagrams, roadmaps and executive presentation","analogy":"The best architectural diagram lets a nonengineer see the problem while allowing engineers to build the solution.","concept":"A strong identity architecture deliverable includes current state, future state, actors, trust boundaries, data flows, enforcement points, identity lifecycle, migration phases, service dependencies, ownership and recovery paths. Use Lucidchart or a similar diagramming tool with a consistent legend. Present business outcomes and tradeoffs in addition to technical detail.","mechanics":"For an executive audience, start with the risk being reduced, user effect, estimated effort, licensing, dependencies, failure modes, success metrics and decision required. For engineers, add protocol flows, app registration details, conditional access policy matrices, test cases and rollback. Do not promise that a proposal is validated before a pilot.","example":"Present a 12-month workforce modernization roadmap: initial inventory, pilot passwordless, B2B governance, legacy app migration, monitoring and quarterly control reviews.","steps":["Draw the current architecture","Choose target-state controls and ownership","Define phases and dependencies","List risks and test gates","Create a five-slide executive-level outline"],"trap":"A pretty drawing without decision records, dependencies and evidence is not an implementable roadmap.","lab":"lab-blueprint","url":"","minutes":40}],"labs":[{"id":"lab-users","title":"Provision a new Finance employee","track":"SC-300","story":"Avery Lane joins the Finance team. Give access through a group rather than handing out broad privileges.","skills":["User lifecycle","Group authorization","Licensing"],"outcome":"Avery exists, belongs to Finance-Restricted and has a mock license.","steps":[{"page":"users","check":"userAvery","task":"Create the user Avery Lane using the New user form.","why":"Creating a member identity is the starting point; authentication exists even when the user has no app authorization."},{"page":"groups","check":"groupFinance","task":"Create the Finance-Restricted security group.","why":"Group-based access scales better than dozens of direct app assignments."},{"page":"groups","check":"financeMember","task":"Add Avery Lane to Finance-Restricted.","why":"Membership translates the business role into enforceable access targeting."},{"page":"users","check":"licenseAvery","task":"Assign an M365 Business Premium mock license to Avery.","why":"A product license and an access permission are different things; many features also require specific license rights."}]},{"id":"lab-au","title":"Delegate regional helpdesk without tenant-wide access","track":"SC-300","story":"A regional helpdesk should manage a subset of accounts, not the entire tenant.","skills":["Administrative units","RBAC"],"outcome":"You created an administrative unit and delegated a limited directory role.","steps":[{"page":"units","check":"unitEast","task":"Create the East Region administrative unit.","why":"Administrative units limit supported directory administration scope."},{"page":"roles","check":"regionalRole","task":"Assign Helpdesk Administrator to Jamie Cole scoped to East Region.","why":"An appropriately scoped built-in role is preferable to Global Administrator for password support."}]},{"id":"lab-attributes","title":"Classify a sensitive app","track":"SC-300","story":"Finance services need a controlled classification label for review and auditing.","skills":["Custom security attributes"],"outcome":"The app record contains a restricted classification.","steps":[{"page":"attributes","check":"attrRestricted","task":"Set classification for Finance API to Restricted.","why":"Security metadata can support governance when its schema and assignment rights are controlled."}]},{"id":"lab-guest","title":"Invite and scope a contractor","track":"SC-300","story":"A co ing on a permanent password."}]},{"id":"lab-risk","title":"Investigate and contain a risky sign-in","track":"SC-300","story":"A payroll admin has a high-risk sign-in from an unfamiliar network.","skills":["Risk investigation","Response","Session revocation"],"outcome":"The high-risk event has a documented response and simulated sessions are revoked.","steps":[{"page":"risks","check":"riskInvestigated","task":"Investigate the seeded high-risk event and mark it Confirmed risk.","why":"Risk events must be triaged with context and evidence, not assumed automatically true."},{"page":"users","check":"sessionsRevoked","task":"Revoke Priya Shah’s sessions from the user details.","why":"Containment should limit ongoing access during an identity compromise investigation."}]},{"id":"lab-policy","title":"Build and test Conditional Access","track":"SC-300","story":"Finance data requires stronger sign-in controls. Pilot rather than immediately enforce.","skills":["Conditional Access","Report-only","What If"],"outcome":"The finance policy exists, has been simulated, and was enabled following review.","steps":[{"page":"policies","check":"caFinance","task":"Create a policy named Finance MFA Pilot, target Finance-Restricted and require MFA; start Report-only.","why":"Report-only and scoped pilot groups reduce accidental disruption."},{"page":"whatif","check":"whatIfTest","task":"Run What If for Avery Lane and Finance Reports with an unmanaged device.","why":"A policy is a hypothesis until you validate its effect on expected user flows."},{"page":"policies","check":"caEnabled","task":"Enable Finance MFA Pilot after the simulated What If check.","why":"Promotion should occur only after the administrator reviews blast radius, logs and emergency access safeguards."}]},{"id":"lab-gsa","title":"Design private application access","track":"SC-300","story":"Remote staff need payroll access without full VPN connectivity.","skills":["Global Secure Access","Private Access"],"outcome":"A mock private access profile is created and scoped to Finance.","steps":[{"page":"gsa","check":"gsaPrivate","task":"Create a Global Secure Access traffic profile for Private Access.","why":"App-focused access can reduce broad network exposure."},{"page":"gsa","check":"gsaTarget","task":"Assign Finance-Restricted as the allowed group on that profile.","why":"An explicit audience makes the security intent testable and reviewable."}]},{"id":"lab-managed","title":"Use a managed identity for a cloud workload","track":"SC-300","story":"A background payroll job needs to read a narrow cloud resource.","skills":["Managed identity","Azure RBAC"],"outcome":"The mock workload identity has a narrow resource grant.","steps":[{"page":"managed","check":"managedPayroll","task":"Create a managed identity named Payroll-Worker.","why":"Automated workloads should not borrow a human user credential."},{"page":"managed","check":"managedScoped","task":"Grant Payroll-Worker the Secrets User permission on PayrollVault.","why":"Creating an identity alone does not authorize it; scope only the needed permission."}]},{"id":"lab-app","title":"Integrate a SaaS application with SAML","track":"SC-300","story":"Finance employees need a new Vendor Portal sign-on.","skills":["Enterprise apps","SAML","Assignment"],"outcome":"Vendor Portal is integrated and scoped in the practice directory.","steps":[{"page":"apps","check":"appVendor","task":"Create a Vendor Portal enterprise application.","why":"App objects manage local assignments and integration configuration."},{"page":"apps","check":"appSaml","task":"Set Vendor Portal sign-on method to SAML.","why":"SAML creates a trust relationship for compatible web SSO flows."},{"page":"apps","check":"appFinanceGroup","task":"Assign Finance-Restricted to Vendor Portal.","why":"Authentication does not replace app authorization; assignment controls who may use the app."}]},{"id":"lab-reg","title":"Register a least-privilege API client","track":"SC-300","story":"An internal  group.","skills":["Access reviews","Removal"],"outcome":"An access review has been recorded with a denied entitlement.","steps":[{"page":"reviews","check":"reviewFinance","task":"Create an access review for Finance-Restricted.","why":"Reviews generate repeatable evidence and an assigned decision-maker."},{"page":"reviews","check":"reviewRemoved","task":"Review and revoke Jamie Cole’s Finance membership if present; otherwise revoke seeded obsolete guest access.","why":"Audit success requires verifying the authorization was actually removed."}]},{"id":"lab-pim","title":"Create and activate eligible administrator access","track":"SC-300","story":"Jamie needs temporary Conditional Access Administrator privileges.","skills":["PIM","Least privilege"],"outcome":"Jamie has a recorded one-hour activation in the mock tenant.","steps":[{"page":"pim","check":"pimEligible","task":"Create an eligible PIM assignment for Jamie Cole to Conditional Access Administrator.","why":"Eligibility avoids permanently active privileges."},{"page":"pim","check":"pimActive","task":"Activate Jamie’s role for one hour with justification.","why":"Timed elevation creates traceable, purpose-specific privilege with bounded exposure."}]},{"id":"lab-logs","title":"Investigate a failed sign-in with logs","track":"SC-300","story":"Finance Reports denies a legitimate user after a policy update.","skills":["Sign-in logs","KQL","Diagnostics"],"outcome":"The log query ran and sample diagnostics are configured.","steps":[{"page":"logs","check":"logsQueried","task":"Run the sample KQL filter for failed sign-ins.","why":"Logs show what happened, while policy evaluation explains what decided access."},{"page":"diagnostics","check":"diagnosticsOn","task":"Configure a mock diagnostic destination to Log Analytics.","why":"For production operations, you need a designed log collection and retention destination."}]},{"id":"lab-devices","title":"Register and evaluate a managed device","track":"SC-300","story":"A compliant laptop should be recognized separately from an untrusted device.","skills":["Devices","Compliance"],"outcome":"Avery-Laptop is compliant in the mock device inventory.","steps":[{"page":"devices","check":"deviceCompliant","task":"Mark Avery-Laptop as compliant in the device simulator.","why":"Device compliance signals can be evaluated by Conditional Access where supported."}]},{"id":"lab-proxy","title":"Protect a legacy on-premises web app","track":"SC-300","story":"Legacy HR is on-premises and must be made accessible without exposing broad internal network access.","skills":["Application Proxy","Legacy migration"],"outcome":"Legacy HR has a simulated external application publication.","steps":[{"page":"proxy","check":"proxyCreated","task":"Publish Legacy HR through the mock Application Proxy configuration.","why":"Connectors and app-specific publication can replace direct inbound exposure for eligible apps."}]},{"id":"lab-blueprint","title":"Build an executive identity architecture","track":"SC-100","story":"The executive team needs a modernization plan and risk-controlled rollout.","skills":["Zero Trust","Architecture","Executive communication"],"outcome":"A printable decision-based security blueprint has been saved.","steps":[{"page":"blueprint","check":"blueprintSaved","task":"Select recommended identity, privileged access, monitoring and recovery controls and save the blueprint.","why":"An architecture is a set of justified decisions, not a vendor logo collection."}]},{"id":"lab-registry","title":"Compare token and protocol flows","track":"SC-900","story":"A modern SaaS application needs user login and delegated API access.","skills":["OIDC","OAuth","SAML"],"outcome":"You explored the token trust boundaries.","steps":[{"page":"flows","check":"flowUnderstood","task":"Run the OIDC flow visualizer and identify the ID token and access token recipients.","why":"Authentication and delegated API authorization have different token audiences."}]},{"id":"lab-sspr","ti ithout a sponsor.","skills":["OAuth","Consent"],"outcome":"The risky mock app was denied.","steps":[{"page":"defender","check":"oauthDenied","task":"Deny the broad Files.ReadWrite.All consent request.","why":"Admin consent is a security decision about tenant-wide authority, not a harmless approval button."}]}],"questions":[{"id":"q001","track":"SC-900","domain":"Security concepts","stem":"An analyst successfully signs in to an identity provider but receives access denied when opening the payroll application. What is the most likely distinction?","choices":["Authentication succeeded but authorization was not granted","Authorization succeeded but authentication failed","Encryption failed before sign-in","The employee must be in another tenant"],"answers":[0],"why":"Authentication proves the principal; authorization separately determines access to the payroll resource.","type":"single"},{"id":"q002","track":"SC-900","domain":"Security concepts","stem":"Your organization stores confidential data in a cloud SaaS service. Which responsibility commonly remains with the customer?","choices":["Physical security of provider datacenters","Controlling internal users and data sharing","Manufacturer firmware for provider servers","Datacenter power resilience"],"answers":[1],"why":"Cloud customers retain responsibility for identities, appropriate data classification and access decisions.","type":"single"},{"id":"q003","track":"SC-900","domain":"Security concepts","stem":"A company wants to continuously evaluate access signals and minimize standing privileges. Which guiding strategy is most aligned?","choices":["Zero Trust","Perimeter-only network trust","Disable all encryption","Trust devices once at enrollment forever"],"answers":[0],"why":"Zero Trust verifies explicitly, uses least privilege and assumes breach.","type":"single"},{"id":"q004","track":"SC-900","domain":"Security concepts","stem":"A second independent mechanism prevents exfiltration after one perimeter rule is bypa

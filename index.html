<script>const ACADEMY = {
  "lessons": [
    {
      "id": 1,
      "title": "Endpoints, Windows and networks",
      "unit": 1,
      "aim": "Explain what an endpoint is, what Windows controls locally, and why cloud management needs network and identity connectivity.",
      "scene": "A new employee receives a laptop that must work at home. It needs Wi-Fi, a work identity, required applications, security settings, and a way for IT to monitor its health.",
      "analogy": "Think of the laptop as a branch office: Windows runs the building; networking connects it; identity checks the employee; Intune sends the operating rules.",
      "concepts": [
        {
          "name": "Endpoint vs. operating system",
          "explain": "An endpoint is a user-facing device such as a Windows laptop, Mac, phone, kiosk, or Cloud PC. The operating system is the software running on it. Intune manages supported endpoints; it does not replace Windows, macOS, or Android.",
          "example": "A Windows 11 laptop is the endpoint; Windows 11 Pro is the operating system.",
          "watch": "Not every device or edition supports every management feature."
        },
        {
          "name": "Network path",
          "explain": "A managed device needs working DNS, HTTPS, correct time, and access to Microsoft cloud endpoints. DNS converts names to IP addresses. HTTPS uses encrypted connections, generally TCP 443.",
          "example": "A device can browse local files but fail to check in because a proxy blocks required Microsoft endpoints.",
          "watch": "An internet connection alone does not prove Microsoft service endpoints are reachable."
        },
        {
          "name": "Local vs cloud state",
          "explain": "Windows stores local settings, logs, apps, and user profiles. Intune holds desired cloud policies and management records. Devices periodically connect and report status; changes are not guaranteed instant.",
          "example": "IT changes a Wi-Fi profile at 9 AM, but an offline laptop applies it only after it reconnects.",
          "watch": "A portal showing a policy assignment does not prove the endpoint applied it."
        },
        {
          "name": "Troubleshooting layers",
          "explain": "Start with power/OS, then networking, identity and licensing, enrollment, policy delivery, and application behavior. Fix the lowest broken layer first.",
          "example": "An app install error caused by no network access is not solved by re-creating the app package.",
          "watch": "Avoid wipe or reset before collecting logs and testing simpler hypotheses."
        }
      ],
      "flow": [
        {
          "label": "Device boots",
          "detail": "Windows starts and loads its local configuration."
        },
        {
          "label": "Network connects",
          "detail": "DNS resolves service endpoints and HTTPS reaches Microsoft."
        },
        {
          "label": "User authenticates",
          "detail": "Microsoft Entra ID verifies the work identity and required factors."
        },
        {
          "label": "Device manages",
          "detail": "Intune delivers applicable settings and software after enrollment."
        },
        {
          "label": "Status returns",
          "detail": "The admin sees device, compliance, policy and app results."
        }
      ],
      "lab": [
        "On any Windows 11 test PC, open Settings > System > About and record OS edition and build.",
        "Open Settings > Network & internet. Note your active connection and whether you are on Wi-Fi or Ethernet.",
        "Open PowerShell and run `hostname`, `ipconfig`, and `nslookup enterpriseregistration.windows.net`; describe what each reveals.",
        "Open Event Viewer. Locate Windows Logs > System and note the Event ID, source, and timestamp of a harmless informational event.",
        "Draw a diagram with the five stages above. Mark which evidence comes from Windows and which comes from a cloud portal.",
        "Tabletop: A device is offline for three days. Predict which changes can occur locally and which cloud policies must wait.",
        "Record a one-minute explanation of the difference between Windows, Entra ID, and Intune."
      ],
      "success": [
        "You can locate OS edition, network properties and Windows event evidence.",
        "You can name three non-Intune reasons a device might fail to check in."
      ],
      "pitfalls": [
        "Do not perform commands that reset network configuration on your everyday computer.",
        "Windows Home has limitations for business join and Intune scenarios; use supported test editions.",
        "A device shown in Entra is not necessarily enrolled in Intune."
      ],
      "quiz": [
        {
          "prompt": "An assigned policy is not arriving on a laptop. What do you verify first?",
          "choices": [
            "Whether the device is powered on and can reach required services",
            "Whether the user prefers dark mode",
            "Whether to wipe every device",
            "Whether the monitor is 4K"
          ],
          "correct": 0,
          "why": "Check the basic device and connectivity layers before changing policies."
        },
        {
          "prompt": "What is the relationship between Windows and Intune?",
          "choices": [
            "Intune replaces Windows",
            "Windows is the device OS; Intune manages supported settings and apps",
            "Windows must be installed on Microsoft servers",
            "Intune is only antivirus"
          ],
          "correct": 1,
          "why": "Intune orchestrates management while Windows remains the OS."
        },
        {
          "prompt": "Why does DNS matter?",
          "choices": [
            "It finds network addresses for service names",
            "It assigns Intune licenses",
            "It encrypts BitLocker drives",
            "It installs Win32 software"
          ],
          "correct": 0,
          "why": "DNS name resolution is a prerequisite for reaching many cloud services."
        }
      ],
      "docs": "https://learn.microsoft.com/en-us/intune/fundamentals/what-is-intune",
      "tags": "windows basics network endpoint dns"
    },
    {
      "id": 2,
      "title": "Microsoft 365, tenant and licensing",
      "unit": 1,
      "aim": "Map the Microsoft 365 tenant, Intune subscription, Entra identities and security add-ons without confusing their roles.",
      "scene": "A 40-person company wants device management. The owner already buys Microsoft 365 licenses but does not know if those plans include Intune or Conditional Access.",
      "analogy": "A tenant is your company’s secure cloud campus; subscriptions unlock buildings; accounts are people; roles are keycards.",
      "concepts": [
        {
          "name": "Tenant and subscription",
          "explain": "A Microsoft 365 / Entra tenant is the organization boundary. It contains identities, groups, devices, administrative roles and connected cloud resources. A subscription licenses specific services and features.",
          "example": "Two companies can both use Intune but have separate tenants, user directories and data.",
          "watch": "Creating a tenant is not the same as licensing all features."
        },
        {
          "name": "Intune Plan 1 vs add-ons",
          "explain": "Intune Plan 1 covers fundamental endpoint management. Intune Suite and individual add-ons offer features such as Remote Help, Endpoint Privilege Management and Cloud PKI. Some scenarios also depend on Windows and Microsoft Entra licensing.",
          "example": "A basic device configuration lab may run under a trial, while Remote Help or EPM may require an additional trial or license.",
          "watch": "Check official feature entitlements before designing a lab; do not assume a trial includes every add-on."
        },
        {
          "name": "Entra licensing",
          "explain": "Microsoft Entra ID manages identities and sign-in. Features such as Conditional Access and some automatic enrollment scenarios require appropriate Entra licensing (often P1 or equivalent).",
          "example": "A policy could appear in a portal, but the organization may not be licensed to use its intended capability.",
          "watch": "Licenses are assigned to the appropriate benefiting users or devices; admin access and licensing are separate questions."
        },
        {
          "name": "Least privilege and cost",
          "explain": "Use a dedicated lab tenant, avoid production data, and use role-based access control. Prefer temporary feature trials over unnecessary paid services. Track renewal and deletion dates.",
          "example": "You might need a Global Administrator for initial setup but should use a narrower Intune role for normal work.",
          "watch": "Do not connect your primary work device or personal phone to a test tenant unless you accept management impact."
        }
      ],
      "flow": [
        {
          "label": "Organization",
          "detail": "Create or use an authorized tenant."
        },
        {
          "label": "Subscription",
          "detail": "Confirm Intune and any required Entra entitlement."
        },
        {
          "label": "Users",
          "detail": "Provision test identities and assign eligible licenses."
        },
        {
          "label": "Groups",
          "detail": "Create pilot assignments to avoid broad impact."
        },
        {
          "label": "Admin roles",
          "detail": "Grant only the permissions needed for each task."
        }
      ],
      "lab": [
        "Without purchasing anything, write a fictional tenant design for Northstar Devices LLC with 12 users and 10 PCs.",
        "Create a licensing matrix with features: Intune Plan 1, Entra Conditional Access, Windows Autopilot, Remote Help, and EPM.",
        "Check the linked official licensing page and mark each item included, optional add-on, or dependent on another service.",
        "If you have an eligible trial, sign up using a new lab identity and record subscription start/end dates; otherwise keep this as a paper lab.",
        "Draft two admin roles: Lab Setup Admin (temporary broad privileges) and Device Operator (limited).",
        "Write a safe-lab policy: no production data, no primary computer wipe, pilot assignments only.",
        "Explain to a mock customer why device licenses and user licenses are not interchangeable in all scenarios."
      ],
      "success": [
        "You can distinguish tenant, subscription, user, device and role.",
        "You have a cost-aware licensing and trial plan."
      ],
      "pitfalls": [
        "Do not promise Intune Suite features with a Plan 1-only subscription.",
        "Never use a customer or employer tenant for experimentation without permission.",
        "Do not assume that every Windows edition supports Entra join or Autopilot."
      ],
      "quiz": [
        {
          "prompt": "Which object is the organization boundary for Entra identities?",
          "choices": [
            "A configuration profile",
            "A tenant",
            "A Win32 detection rule",
            "A device serial number"
          ],
          "correct": 1,
          "why": "The tenant is the organization identity and service boundary."
        },
        {
          "prompt": "You want to test Endpoint Privilege Management. What should you check?",
          "choices": [
            "Device wallpaper",
            "Whether the required add-on is licensed",
            "A random DNS server",
            "Monitor brightness"
          ],
          "correct": 1,
          "why": "EPM is an additional capability with its own entitlement requirements."
        },
        {
          "prompt": "What is the safest default for cloud administration?",
          "choices": [
            "Use Global Administrator for everyone",
            "Give least-privilege role assignments",
            "Share one admin password",
            "Disable auditing"
          ],
          "correct": 1,
          "why": "Role-based least privilege limits unintended changes and exposure."
        }
      ],
      "docs": "https://learn.microsoft.com/en-us/intune/fundamentals/licensing",
      "tags": "tenant licensing subscription administrator"
    },
    {
      "id": 3,
      "title": "Microsoft Entra identities, groups and join states",
      "unit": 1,
      "aim": "Differentiate Microsoft Entra registered, Microsoft Entra joined and hybrid joined devices; design static and dynamic groups.",
      "scene": "A personal phone signs into Teams; a corporate Windows laptop needs full cloud join; an older office PC remains domain joined. Are they managed in the same way?",
      "analogy": "Registration is signing the guestbook, joining is getting a staff badge, and Intune enrollment is accepting the building rules.",
      "concepts": [
        {
          "name": "Entra registered",
          "explain": "Registration associates a device with an identity, commonly when personal devices access work apps. Registration by itself does not mean full MDM control.",
          "example": "An employee adds a work account to an iPhone and the device is registered.",
          "watch": "Do not equate registered with enrolled or compliant."
        },
        {
          "name": "Entra joined",
          "explain": "A cloud-native corporate Windows device can be joined to Microsoft Entra ID and users sign in with organizational credentials. Auto-enrollment into Intune is a separate configured step.",
          "example": "A newly deployed Windows 11 Pro laptop signs in to the company and is automatically enrolled.",
          "watch": "Not every registered device is joined; not every joined device is Intune enrolled."
        },
        {
          "name": "Hybrid joined",
          "explain": "A device can be joined to on-premises Active Directory and registered in Entra through a hybrid join process. This adds synchronization and connectivity dependencies.",
          "example": "A legacy office machine remains domain joined while management is modernized.",
          "watch": "Hybrid join and co-management are related but distinct concepts; neither means a device is automatically fully cloud-managed."
        },
        {
          "name": "Groups and targeting",
          "explain": "Intune policies and app deployments target Entra groups. Static groups are maintained by admins; dynamic groups use membership rules and eligible licensing. Membership processing can introduce delay.",
          "example": "A Pilot-Windows group receives new security settings before All-Windows.",
          "watch": "Group membership is not proof of successful policy application; also review filters and conflicts."
        }
      ],
      "flow": [
        {
          "label": "Identity",
          "detail": "Create licensed test user or device identity."
        },
        {
          "label": "Device state",
          "detail": "Determine registered, Entra joined or hybrid joined."
        },
        {
          "label": "Group",
          "detail": "Add to static pilot group or configure a dynamic rule."
        },
        {
          "label": "MDM enrollment",
          "detail": "Enable supported Intune enrollment for target devices."
        },
        {
          "label": "Assignment",
          "detail": "Target the device or user with controlled policies."
        }
      ],
      "lab": [
        "Build a 3-column comparison table: registered, joined, hybrid joined. Include typical ownership, login and dependencies.",
        "On a lab Windows PC, open a command prompt and run `dsregcmd /status`; identify the AzureAdJoined, DomainJoined and WorkplaceJoined fields (do not paste identifiers publicly).",
        "Draw a user-to-group-to-policy assignment map for Pilot-Windows and Sales-Users.",
        "In a trial tenant, create two fictional users and a static security group using Microsoft Entra admin center.",
        "Add only the designated test user to the pilot group. Capture the group membership screen without personal data.",
        "Tabletop: Design a dynamic device group for Windows corporate laptops; describe the rule inputs you must verify before creation.",
        "Explain why a user in the right group might still lack a device-targeted policy."
      ],
      "success": [
        "You can read the join-state fields without mixing them up.",
        "You can design a pilot group and trace which object a policy targets."
      ],
      "pitfalls": [
        "Microsoft Entra join is not equivalent to enrollment.",
        "Dynamic membership relies on suitable licensing and device attributes.",
        "Different policies have different user/device targeting semantics."
      ],
      "quiz": [
        {
          "prompt": "A personal laptop is Entra registered. Is it automatically fully managed by Intune?",
          "choices": [
            "Yes, always",
            "No, registration and Intune enrollment are different states",
            "Yes, all users become admins",
            "No cloud identity exists"
          ],
          "correct": 1,
          "why": "Registration associates an identity; MDM management requires its own enrollment path."
        },
        {
          "prompt": "How do you limit a test profile to 3 devices?",
          "choices": [
            "Assign to an isolated pilot group",
            "Assign to all devices",
            "Disable all groups",
            "Delete device inventory"
          ],
          "correct": 0,
          "why": "Use a scoped assignment to reduce blast radius."
        },
        {
          "prompt": "Which command is useful for investigating Windows Entra join state?",
          "choices": [
            "ipconfig /flushdns",
            "dsregcmd /status",
            "format c:",
            "shutdown /s"
          ],
          "correct": 1,
          "why": "dsregcmd /status shows device and user join/registration signals."
        }
      ],
      "docs": "https://learn.microsoft.com/en-us/entra/identity/devices/overview",
      "tags": "entra group join registered hybrid"
    },
    {
      "id": 4,
      "title": "Inside the Intune admin center",
      "unit": 1,
      "aim": "Navigate Devices, Apps, Endpoint security, Reports, Tenant administration and Troubleshooting, and recognize reporting states.",
      "scene": "The help desk gets a ticket: “Teams says it cannot access company data.” Where should you start, and which portal is the source of truth?",
      "analogy": "Treat the admin center like an airport control tower: device gates, software baggage, security screening, reports and support desks.",
      "concepts": [
        {
          "name": "Control plane",
          "explain": "The Intune admin center is the cloud management interface for enrollment, policies, apps, device actions and reporting. Different workloads lead to different kinds of evidence.",
          "example": "Devices > All devices is the place to start reviewing a device record and its management state.",
          "watch": "Navigation labels change over time; use Microsoft Learn and the built-in search if a path moves."
        },
        {

function makeExam(){let quotas={infrastructure:9,management:11,security:7,applications:7,operations:6};let arr=[];for(let [dom,n] of Object.entries(quotas)){let pool=deep(ACADEMY.questions.filter(q=>q.domain===dom));for(let i=pool.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}arr.push(...pool.slice(0,n))}for(let i=arr.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}let questions=arr.map(q=>{let index=[0,1,2,3];for(let k=3;k>0;k--){let j=Math.floor(Math.random()*(k+1));[index[k],index[j]]=[index[j],index[k]]}return {id:q.id,choiceOrder:index}});state.exam={questions,answers:{},index:0,started:Date.now(),finished:false,endsAt:Date.now()+75*60*1000};save();nav('exam')}
function examSummary(){let e=state.exam;let items=e.questions.map(item=>{let q=ACADEMY.questions.find(x=>x.id===item.id),ans=e.answers[q.id],chosen=ans!=null?item.choiceOrder[ans]:null;return {...q,selected:chosen,isCorrect:chosen===q.correct}});let good=items.filter(q=>q.isCorrect).length,percent=Math.round(good/items.length*100),domainRows=ACADEMY.domains.map(d=>{let subset=items.filter(q=>q.domain===d.id);return {name:d.title,done:subset.filter(q=>q.isCorrect).length,total:subset.length}});return {items,good,percent,domainRows}}
function finishExam(){if(!state.exam||state.exam.finished)return;state.exam.finished=true;let {percent,good,domainRows}=examSummary();state.examHistory.push({time:date(),percent,good,total:state.exam.questions.length,domainRows});save();toast('Practice exam submitted: '+percent+'%');render()}
function mmss(ms){ms=Math.max(0,ms);let x=Math.floor(ms/1000);return String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0')}
function examPage(){let e=state.exam;if(!e)return head('Assessment','MD-102 scenario exam','40 randomized practice questions drawn from an original question bank, covering the five official objective domains. Not exam dumps or actual Microsoft exam items.')+`<div class="two-col"><div class="card"><h2>What this exam measures</h2><p>Every question gives a plausible workplace scenario and asks you to choose a safe and technically appropriate administrative decision.</p>${process(['Read scenario','Choose best action','Review result','Study weak domains'])}<div class="metricrow"><strong>Questions</strong><span>40, randomized</span></div><div class="metricrow"><strong>Time limit</strong><span>75 minutes</span></div><div class="metricrow"><strong>Explanations</strong><span>After submission</span></div><div class="metricrow"><strong>Score interpretation</strong><span>Diagnostic only</span></div><div class="buttons">${btn('Start timed assessment','data-action="startexam"','primary')}</div></div>${box('Official exam difference',`<p class="small">Microsoft tests may include different formats, unscored items and knowledge not present here. A successful local mock exam is not an official Microsoft score or readiness guarantee.</p><p><a href="https://learn.microsoft.com/en-us/credentials/certifications/modern-desktop/" target="_blank" rel="noopener">Microsoft official MD-102 certification page ↗</a></p>`)}</div>`;
 if(e.finished){let s=examSummary();return head('Assessment','Practice exam results','See explanations for every question, including correct answers and the reasoning behind each decision.',btn('Start a new randomized exam','data-action="startexam"','primary'))+`<div class="four-col"><div class="card"><div class="scorebig">${s.percent}%</div><div class="statlabel">Practice score</div></div><div class="card"><div class="scorebig">${s.good}</div><div class="statlabel">Correct answers</div></div><div class="card"><div class="scorebig">${s.items.length-s.good}</div><div class="statlabel">Missed or unanswered</div></div><div class="card"><div class="scorebig">${s.items.length}</div><div class="statlabel">Total questions</div></div></div><div class="section">${box('Performance by MD-102 skill domain',s.domainRows.map(d=>`<div class="metricrow"><strong>${esc(d.name)}</strong><span>${d.done}/${d.total} correct</span></div>`).join(''))}</div><div class="section">${s.items.map((q,i)=>`<div class="questionbox"><div class="super">QUESTION ${i+1} · ${esc(q.domain)}</div><h3>${esc(q.prompt).replace(/\n/g,'<br>')}</h3><div>${chip(q.isCorrect?'Correct':'Review needed')}</div><p><strong>Your answer:</strong> ${q.selected==null?'Unanswered':esc(q.choices[q.selected])}</p><p><strong>Best answer:</strong> ${esc(q.choices[q.correct])}</p><div class="answerhint"><strong>Reasoning:</strong> ${esc(q.why)}</div></div>`).join('')}</div>`}
 let idx=e.index||0,item=e.questions[idx],q=ACADEMY.questions.find(x=>x.id===item.id),answer=e.answers[q.id],filled=e.questions.filter(item=>e.answers[item.id]!=null).length,remaining=e.endsAt-Date.now();if(remaining<=0){finishExam();return examPage()};return head('Assessment / Timed exam','MD-102 scenario practice','Read carefully. The options are randomized, and answer explanations are withheld until final submission.',btn('Finish and score exam','data-action="finishExam"','warn'))+`<div class="two-col"><div><div class="card"><div class="between"><div class="super">QUESTION ${idx+1} OF ${e.questions.length}</div><div class="chip warn" id="examclock">${mmss(remaining)} remaining</div></div><div class="progress" style="margin:17px 0"><i style="width:${filled/e.questions.length*100}%"></i></div><h2>${esc(q.prompt).replace(/\n/g,'<br>')}</h2><div class="section">${item.choiceOrder.map((original,j)=>`<button class="answer ${answer===j?'correct':''}" data-examanswer="${q.id}:${j}"><span class="letter">${'ABCD'[j]}</span>${esc(q.choices[original])}</button>`).join('')}</div><div class="buttons">${btn('← Previous','data-exammove="-1"', 'small')}${btn('Next →','data-exammove="1"','primary')}${btn('Submit exam','data-action="finishExam"','warn')}</div></div></div><div class="card"><h3>Assessment navigator</h3><p class="small muted">${filled}/${e.questions.length} answered · avoid guessing from the visual order of answers.</p><div class="examnav">${e.questions.map((x,i)=>`<button class="examnum ${e.answers[x.id]!=null?'done':''} ${idx===i?'active':''}" data-examjump="${i}">${i+1}</button>`).join('')}</div><div class="warning"><strong>Exam advice:</strong> For every policy decision, check applicability, licensing, scope, prerequisites and likely impact first.</div></div></div>`;
}

function fieldWhy(entity,key){const general={name:'Recognizable names help operators identify, review and audit a change later.',platform:'Only supported platform-specific controls apply; a Windows profile cannot configure Android.',group:'Assignment controls which device population is eligible. Start with a pilot and verify membership.',scope:'A narrow scope reduces accidental cross-department access.',filter:'Filters can include or exclude supported device properties from an assignment.',type:'The workload type determines available settings, prerequisites and diagnostics.',mode:'Different management or enforcement modes have materially different security and user impact.',rule:'Dynamic membership evaluates device properties; assigned groups contain explicitly selected members.',join:'Entra registration, Entra join and hybrid join are not equivalent to Intune enrollment.',ownership:'Corporate-owned and personal devices have different privacy and management expectations.',intent:'Required deploys automatically; Available lets a user install; Uninstall reverses an assignment where supported.',detection:'A correct detection rule verifies installation. A process exiting successfully may not prove installation.',qualityDeferral:'A deferral changes when updates are offered. It is not proof that a device has installed them.',deadline:'Restart deadlines control user experience; always consider disruption and safety.',requiresEncryption:'This evaluates whether the endpoint is encrypted; a separate policy can configure encryption.',requiresDefender:'Antivirus reports may depend on platform and supported signals.',grant:'A grant control is evaluated during identity access. Test it in Report-only before enforcing.',target:'Which users will be impacted? Plan exclusions for tested emergency accounts.',tag:'Scope tags help limit visibility for supported scoped administration objects.',script:'Script text is stored locally for education and is never run.'};return general[key]||({security:'Pilot a security setting and inspect actual device effects before widening the assignment.',suite:'Review product licensing, prerequisites, supportability and human approvals.',cloudpc:'Cloud PC policies require actual licenses and supported cloud network/image prerequisites.',access:'Policy decisions affect access; analyze break-glass protections.',apps:'Check packaging, applicability and detailed installation status.'}[entity]||'This setting changes simulated evaluation and is never sent to Microsoft.');}
function assignmentPreview(route){let arr=state.records[route]||[],devices=state.records.devices;if(!arr.length)return '';
 if(['configuration','compliance','security','apps','protection','updates','autopilot','access'].includes(route)){
 let rows=arr.map(rec=>{let eligible=devices.filter(d=>['updates','autopilot'].includes(route)?d.platform==='Windows'&&matchesGroup(d,rec.group):route==='access'?d.enrolled:route==='protection'?rec.platform===d.platform&&matchesGroup(d,rec.group):applies(rec,d));let evaluated=eligible.filter(d=>d.enrolled&&Number(d.syncCount||0)>0);let reported=route==='compliance'?evaluated.filter(d=>d.compliant).length:route==='security'?evaluated.filter(d=>rec.type==='Disk encryption'?d.bitlocker:rec.type==='Antivirus'?d.defender:true).length:route==='updates'?evaluated.filter(d=>d.updated).length:route==='apps'?evaluated.filter(d=>(d.appInstalled||[]).includes(rec.name)).length:route==='access'||route==='autopilot'||route==='protection'?0:evaluated.length;
 let text=route==='access'?'Model access only':route==='autopilot'?'Applied at provisioning, not retroactive':route==='protection'?'Requires supported app + identity':eligible.length===0?'No eligible devices':evaluated.length===0?'Pending endpoint sync':String(reported)+' of '+String(eligible.length)+' simulated checks met';return `<tr><td>${esc(rec.name)}</td><td>${eligible.length}</td><td>${esc(text)}</td></tr>`});
 return box('Assignment preview · based on local practice data',`<p class="small muted">Eligible targets and simplified outcomes help you reason about scope. Real Intune has richer per-setting error and conflict reporting.</p>${table(['Policy / app','Eligible devices','Practice result'],rows)}`)
 }return '';
}

 let fieldKinds={group:2,filter:2,scope:2,tag:2,target:2,apps:2};let fieldViews=config.fields.map(([key,caption,type,val],index)=>{let value=rec?.[key]??(type==='select'?val[0]:type==='bool'?val:'');let options=(type==='select'&&['group','scope'].includes(key))?[...new Set([...val,...state.records.groups.map(g=>g.name)])]:(type==='select'&&key==='user')?[...new Set([...val,...state.records.users.map(u=>u.name)])]:val;

 let n=fieldKinds[key]!==undefined?2:index<2?0:1;return {n,html:`<div class="field"><label for="f-${key}">${esc(caption)}${key==='name'?' *':''}</label>${input}<small>${esc(fieldWhy(entity,key))}</small></div>`}});

 </form>${rec?`<div class="section"><button class="btn danger small" data-remove="${entity}:${rec.id}">Delete practice record</button></div>`:''}</div></div>`;wizardStage(0);

function wizardStage(index){let form=document.getElementById('recordform');if(!form)return;let i=Math.max(0,Math.min(3,index));form.dataset.stage=String(i);form.querySelectorAll('.wizardStage').forEach(el=>{el.hidden=Number(el.dataset.stage)!==i;el.style.display=Number(el.dataset.stage)===i?'block':'none'});document.querySelectorAll('[data-wizmarker]').forEach(el=>{let n=Number(el.dataset.wizmarker);el.classList.toggle('active',n===i);el.classList.toggle('complete',n<i)});let prev=form.querySelector('[data-wizprev]'),next=form.querySelector('[data-wiznext]'),submit=form.querySelector('#wizardSubmit');prev.hidden=i===0;next.hidden=i===3;submit.hidden=i!==3;

 if(b.dataset.retrycase){delete state.caseAttempts[b.dataset.retrycase];save();render();return}
 if(b.dataset.exammove){if(state.exam){state.exam.index=Math.min(Math.max(state.exam.index+Number(b.dataset.exammove),0),state.exam.questions.length-1);save();render()}return}
 if(b.dataset.examjump){if(state.exam){state.exam.index=Number(b.dataset.examjump);save();render()}return}
 if(b.dataset.examanswer){let [id,num]=b.dataset.examanswer.split(':');if(!state.exam?.finished){state.exam.answers[id]=Number(num);save();render()}return}
 if(b.dataset.agent){let [i,choice]=b.dataset.agent.split(':');state.decisions['agent'+i]=choice;log('AI agent recommendation reviewed: signal '+i+' → '+choice,'Agent');save();render();return}
 if(b.dataset.remove){let [name,id]=b.dataset.remove.split(':');confirmDialog('Delete practice record','This deletes only the local simulated record.',()=>{state.records[name]=state.records[name].filter(x=>x.id!==id);log('Deleted '+name+' practice record '+id,'Config');$('modalroot').innerHTML='';render()});return}
 if(b.dataset.action){const act=b.dataset.action;if(act==='closemodal'){$('modalroot').innerHTML='';return}if(act==='confirmyes'){let f=window.pendingConfirm;$('modalroot').innerHTML='';window.pendingConfirm=null;if(f)f();return}if(act==='syncall'){syncAll();return}if(act==='export'){exportState();return}if(act==='csv'){exportCsv();return}if(act==='import'){$('importfile').click();return}if(act==='reset'){maybeReset();return}if(act==='startexam'){makeExam();return}if(act==='finishExam'){finishExam();return}}
 });
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.labcheck){state.labChecks[el.dataset.labcheck]=el.checked;save();toast('Lab step progress saved');return}});
document.addEventListener('input',e=>{const el=e.target;if(el.hasAttribute('data-filtertable')){let text=el.value.toLowerCase();const table=el.closest('.card')?.querySelector('.datatable');if(table)Array.from(table.querySelectorAll('tbody tr')).forEach(tr=>{tr.hidden=!tr.textContent.toLowerCase().includes(text)});return}if(el.id==='glossarysearch'){state.find=el.value;save();let filtered=Object.entries(ACADEMY.glossary).filter(([n,v])=>(n+' '+v).toLowerCase().includes(el.value.toLowerCase()));$('glossaryresults').innerHTML=filtered.map(([k,v])=>`<div class="card tight"><h3>${esc(k)}</h3><p class="small muted">${esc(v)}</p></div>`).join('')||'<div class="empty">No matching terms</div>';return}});
document.addEventListener('submit',e=>{if(e.target.id==='recordform'){e.preventDefault();submitRecord(e.target)}});
$('mobilemenu').addEventListener('click',()=>{let open=$('sidenav').classList.toggle('open');$('mobilemenu').setAttribute('aria-expanded',String(open))});
$('importfile').addEventListener('change',e=>importState(e.target.files[0]));
window.addEventListener('hashchange',()=>{let r=decodeURIComponent(location.hash.slice(1));if(r&&r!==state.route){state.route=r;state.visited=[...new Set([...state.visited,r])];save();render()}});
setInterval(()=>{if(state.route==='exam'&&state.exam&&!state.exam.finished){const n=$('examclock');if(n)n.textContent=mmss(state.exam.endsAt-Date.now());if(state.exam.endsAt<Date.now())finishExam()}},1000);
if(location.hash.slice(1)){const r=decodeURIComponent(location.hash.slice(1));if(r)state.route=r}
state.visited=[...new Set([...state.visited,state.route])];save();render();
